# 함정 데이터: 규칙을 정반대로 어긴 가상 계획서와, 같은 뼈대로 규칙을 지킨 대조군(base). T3 확인 전 초안, 전부 가상.
# 함정 = 대조군에서 한 곳만 바꾼 계획서. replace: [[바꿀 글, 새 글], ...] (대조군 글에 글자 그대로 있어야 한다)
# expect: 뒤집은 규칙이 함정에서 보여야 할 상태 — 미충족 | 경고(그 규칙의 보완 제안이 뜸) | 충족(숨긴 사실을 찾아냄)
#   | 없음(규칙을 지킨 변형: 걸리면 헛경고). 미충족과 경고는 같게 센다(기관 규정은 판정 행 미충족과 보완 제안이 함께 뜬다)
# 탐지 = 함정에서 expect 상태가 나오고 대조군에서는 안 나옴. 기관 규칙처럼 늘 뜨는 알림은 대조군에도 떠서 탐지로 세지 않는다.
# 소속 기관은 그 규칙이 걸리는 기관이다(기관 규칙 함정은 그 기관 소속).
# alt: 뒤집은 규칙 대신 다른 규칙으로 드러나도 되는 신호(따로 센다). fix: 보완 제안(add_text)을 따르는 법
#   replace = 위반 문장을 add_text로 바꾼다 / append = add_text를 덧붙인다 / 없음 = 문장으로 풀 수 없는 설계 문제

bases:
