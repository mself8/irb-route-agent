      수행기관: 가상대학교병원
      연구 방법: 가상대학교병원 데이터팀이 2020년 1월부터 2024년 12월까지 제2형 당뇨병 환자의 진료기록을 가명처리한 데이터셋(나이, 성별, 당화혈색소, 처방 기록)을 제공받아 원내 분석실에서 분석한다.
      다른 기관 데이터와 결합하거나 외부로 반출하지 않는다.
      대상자는 연구번호로 대체하며, 대응표는 데이터팀이 별도 보관하고 연구자는 접근하지 않는다.
      대상자 수: 약 500명
      연구 기간: 2026년 12월 1일부터 2027년 11월 30일까지
      동의: 후향적 기록 연구로 동의면제를 요청한다.
