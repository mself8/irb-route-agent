<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>정답 확인 40건</title>
<style>

:root { --bg: #F4F6FA; --panel: #FFFFFF; --ink: #1F2A44; --muted: #586379; --line: #DCE1EA; --soft: #EEF1F6;
  --mark: #FFE9A8; --mark-ink: #4D3600; --del: #A33A3A; --ok: #1B7A4B; --bad: #B42318; --unk: #8A6D00; --accent: #B85C00; }
@media (prefers-color-scheme: dark) { :root { --bg: #111623; --panel: #192031; --ink: #E4E9F2; --muted: #9AA4B8; --line: #2B3448;
  --soft: #20283A; --mark: #5A4608; --mark-ink: #FFE9A8; --del: #F29B9B; --ok: #5FCF96; --bad: #FF8C82; --unk: #E8C766; --accent: #F2A55A; color-scheme: dark } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif; }
.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 6px; }
.how { margin: 0 0 14px; }
.how li { margin: 2px 0; }
.bar { position: sticky; top: 0; z-index: 3; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 0; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
input#who { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); width: 11em; }
.count { font-variant-numeric: tabular-nums; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 12px; }
button.main { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
button:focus-visible, input:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
#list { display: grid; gap: 14px; margin-top: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 10px; }
.card.done { border-color: var(--ok); }
.head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.no { font-weight: 700; font-variant-numeric: tabular-nums; }
.chip { font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; color: var(--muted); }
.plan { background: var(--soft); border-radius: 6px; padding: 8px 10px; font-size: 14px; overflow-wrap: anywhere; }
.plan div { padding: 1px 0; }
.plan .i { background: var(--mark); color: var(--mark-ink); border-radius: 3px; padding: 0 3px; font-weight: 600; }
.plan .d { color: var(--del); text-decoration: line-through; }
.ans { display: grid; gap: 3px; border-left: 3px solid var(--accent); padding-left: 10px; }
.ans b { color: var(--accent); }
.basis { font-size: 13px; color: var(--muted); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.pick input { accent-color: var(--ink); }
.pick label.o:has(input:checked) { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.pick label.x:has(input:checked) { border-color: var(--bad); color: var(--bad); font-weight: 700; }
.pick label.u:has(input:checked) { border-color: var(--unk); color: var(--unk); font-weight: 700; }
textarea { font: inherit; font-size: 14px; width: 100%; min-height: 2.4em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
#out { width: 100%; min-height: 8em; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.notice { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>정답 확인 40건</h1>
  <ol class="how">
    <li>이름을 적고, 문항마다 우리 정답이 맞는지 <b>맞음 · 틀림 · 모르겠음</b> 중 하나를 누르세요. 틀림이면 이유를 한 줄 적어 주세요.</li>
    <li>노란 줄은 규칙을 지킨 계획서에서 함정으로 넣거나 바꾼 곳, 줄 그은 글은 뺀 곳입니다.</li>
    <li>다 하면 <b>결과 파일 받기</b>를 눌러 내려받은 파일을 송윤 님께 보내 주세요. 표시한 내용은 이 브라우저에 자동 저장됩니다.</li>
  </ol>
  <div class="bar">
    <label>이름 <input id="who" autocomplete="name"></label>
    <span class="count" id="count"></span>
    <button class="main" id="save" type="button">결과 파일 받기</button>
    <button id="copy" type="button">결과 복사</button>
    <span class="notice" id="msg" role="status"></span>
  </div>
  <div id="list"></div>
  <p class="notice">파일 받기가 안 되면 <b>결과 복사</b>를 누르거나 아래 글을 전부 선택해 메시지로 보내 주세요.</p>
  <textarea id="out" readonly aria-label="결과 JSON"></textarea>
</div>

톨릭대학교서울성모병원"], ["s", "연구 종류: 관찰연구(Observational Study)"], ["s", "연구 참여기관: 단일"], ["s", "목표 대상자 수: 400 명"], ["s", "연구 요약: 많은 수술들이 전신마취를 통하여 이루어 집니다, 가장 흔하게 사용되는 마취제는 흡입마취제로 세보플로간, 데스플로란이 있고, 정맥마취제로는 프로포폴 및 레미마졸람등이 있다. 모든 마취제들은 대부분 진통효과가 미약하여 수술 중 오피오이드를 포함하여 그 효과를 증진시킵니다. 이런 과정을 통하여 진행된 수술은, 수술 후 환자들은 모든 수술에 대한 경과의 만족에 대해 환자의 안전과 질평가는 현재 의료시스템에 매우 중요한 역할을 합니다. 수술 후 환자의 회복과 관련하여 안전과 질평가를 위해 이런 환자의 안전과 질 향상을 위하여 통증완화를 위해 자가통증조절장치를 사용하고, 오심, 구토를 위해선 항구토제를 사용합니다. 수술 직후 회복실에서의 환자들의 상태는 마취방법 및 수술의 종류에 따라서 다르게 보여줍니다. 특히, 마취약제에 따른 환자들의 혈역학적 반응과 수술 후 오심, 구토, 통증의 정도로 차이가 발생합니다. 수술 후 통증 또한, 마취관련 외에 수술방법에도 큰 영향을 받게 됩니다. 이런 상태에서 수술직후에 회복실에서부터 환자들의 반응은 수술 후 재원기간 동안의 환자의 치료와 회복에도 영향을 받느지도 환자의 안전과 질평가를 위한 중요한 지표가 될 수 있습니다. 이런 이유로 수술방법 (로봇 슬관절 절개와 일반절개) 과 마취방법(전신마취시 마취약제)에 따른 환자들의 수술 후 전반적인 환자 안정성에 대한 질향상에 효과에 대한 확인이 필요합니다. 특히, 정형외과 슬관절 전 치환술처럼 중동도 통증이 유발되어 환자의 재활과 회복, 나아가 재원기간에도 영향을 줄 수 있는 수술들에서 중요성이 예측되지만, 수술방법과 마취약제에 따른 수술 후 환자관리, 즉 안전과 질평가에 미치는 영향에 대한 보고는 적습니다. 이러한 여러 마취약제들을 통한 전신마취 후 환자의 회복기에 약제별 차이가 있는지를 통하여 환자들에 따른 약제의 선택, 다양한 선택을 제안할 수 있는 중요한 역할을 합니다."], ["s", "연구 방법: 이미 수술을 마친 환자의 마취기록과 진료기록을 후향적으로 분석한다."], ["s", "자료 관리: 연구자는 식별정보를 직접 보지 않는다. 연구진은 가명처리된 자료를 받는다. 가명처리 작업은 서울성모병원 내부 데이터팀이 한다. 자료는 서울성모병원 내부망의 연구용 서버에서만 다룬다. 다른 기관 자료와 결합하지 않고 외부로 반출하지도 않는다."], ["s", "식별 관리: 연구 자료에는 식별자를 기록하지 않는다. 대응표는 서울성모병원에 남고 연구진에게는 넘어오지 않는다."], ["s", "동의: 자료 이용 전 대상자 서면동의를 받는다."], ["s", "연구 기간: 2027.05.09. ~ 2028.04.30."]], "question": "이 연구계획서는 어디에 심의를 신청해야 하나?", "answer": "소속 기관 IRB", "route": "C · 소속 기관 IRB", "basis": "S3 → J1 → J2 → E3 → C1 → D2"}, {"id": "SYN-125", "kind": "합성", "inst": "가상대학교", "lines": [["s", "연구과제명: 폐암 조직 유래 오가노이드의 항암제 반응 분석"], ["s", "연구 책임자 정유아(가상대학교 생명과학과 연구교수), 휴대전화 010-0405-8626"], ["s", "수행기관: 가상대학교(주관), 세브란스병원(자료 제공)"], ["s", "대상자: 폐암 수술 환자의 조직 검체. 만 19세 이상 성인 검체만 포함한다."], ["s", "연구 설계: 조직 검체로 오가노이드를 배양해 약물 반응을 본다. 검체를 분석하는 인체유래물연구다."], ["s", "개인정보 관리: 성명·연락처 같은 식별자는 수집하지 않는다. 자료는 연구용 번호로 구분한다. 코드 부여 후 대응표를 남기지 않고 폐기한다."], ["s", "대상자 수: 대상자 60명"]], "question": "
