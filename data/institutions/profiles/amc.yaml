id: amc
name: 서울아산병원 IRB (기관생명윤리심의위원회 겸 임상연구심의위원회)
short: 서울아산병원
aliases: [서울아산병원, 재단법인아산사회복지재단 서울아산병원, 재단법인 아산사회복지재단 서울아산병원]
submit: ARIS(아산생명과학연구원 통합연구관리시스템, 원외 https://aris.amc.seoul.kr)의 e-IRB에서 연구진이 작성하고 연구책임자가 심의신청 (원내는 AMIS 계정, 외부 연구자는 회원가입)
source: AMC IRB 안내 사이트(대부분 2021 사본)·ARIS IRB 사용자 매뉴얼(2021-07)·임상연구보호프로그램 포켓북(2021-02)·심의일정·심의접수료 페이지 (https://aris.amc.seoul.kr/irb-landing-site/, 확인 2026-09-30)
plan_form: 연구계획서 (ARIS가 연구대상·진행방향·연구구분 선택으로 서식을 자동 생성, 항목은 비공개)
docs:
  신청서: 심의신청서 (ARIS가 자동 생성 · 심의면제는 심의면제 심의신청서식)
  동의서류: "[서식28] 연구대상자 동의 면제 사유서 · [서식29] 연구대상자 서면동의서 면제 또는 변경 사유서 (2021 SOP V14.1 기준, 현행 번호 확인 필요)"
  이력서: "[서식75] 연구자 이력서 · [서식76] 연구담당자 이력서 (연구진 전원, 최근 2년 이내)"
  교육: 연구윤리교육 이수증 (연구진 전원 · 식약처 지정 종사자교육·질병관리청 교육·CITI 등 인정 교육)
  데이터승인: "[서식27] 개인정보 제3자 제공 심의신청서 (연구 목적 제3자 제공 시, 별도 심의유형)"
  면제점검: "[서식42] 심의면제 가능여부 검토리스트 (2021 SOP V14.1 기준)"
  기관서류: 신청서의 데이터변경내역 (해당없음·외부연계또는반출·외부참여·시스템구축필요·가치창출 중 선택)
rules:
  - id: I-AMC-1
    when: exempt
    level: 확인 필요
    warning: 이 기관은 기존 자료를 쓰는 연구라도 서울아산병원 의무기록에 직접 접근하는 연구는 심의면제 대상에서 제외합니다. 면제가 안 될 때의 처리 절차는 공개 자료에 없어 사무국 확인이 필요합니다.
    source: 임상연구보호프로그램 포켓북(2021-02) p.43
  - id: I-AMC-2
    when: always
    level: 확인 필요
    warning: 신규과제를 신청할 때 연구진 전원(연구책임자·공동연구자·연구코디네이터 등)이 최근 2년 이내 이력서와 연구윤리교육 이수증을 냅니다.
    source: AMC IRB 연구자 자격 안내(SOP 제59조, 2021 사본) · 포켓북 p.39
  - id: I-AMC-3
    when: drb
    level: 확인 필요
    warning: 이 기관의 연구 데이터 신청 절차는 'IRB / 데이터심의 소위원회'를 한 단계로 안내하고 선후를 적지 않습니다. 임상연구 데이터웨어하우스 자료는 IRB 승인 뒤에만 내려받을 수 있습니다. 순서는 사무국 확인이 필요합니다.
    source: ACROD 데이터 신청 안내(acrod.amc.seoul.kr) · 빅데이터연구센터 안내
  - id: I-AMC-4
    when: export
    level: 확인 필요
    warning: 심의신청서의 데이터변경내역에 '외부연계또는반출'을 표시합니다. 연구 목적으로 개인정보를 제3자에게 제공하면 별도 심의유형([서식27])으로 신청합니다.
    source: ARIS IRB 사용자 매뉴얼(2021-07) 10·17쪽
  - id: I-AMC-5
    when: always
    level: 안내
    warning: 심의접수료가 있습니다. 연구자 주도 연구는 연구비 1천만원 이상일 때 초기심의 20만원(부가세 별도), 국책과제는 초기 50만원·지속 20만원이며, 행정접수일부터 통지서 출력 전까지 냅니다.
    source: AMC IRB 심의접수료 안내(2024-03-01부, 페이지 2025-08-20 수정)
drb_order: unknown   # IRB / 데이터심의 소위원회를 한 단계로 안내하고 선후를 적지 않음
schedule: {kind: none, note: "2026 정규회의(A·B·C·D·F 패널, 월 1회 월요일)와 신속심의(E 패널·데이터패널, 목요일) 날짜·접수기간은 공개됨(data/schedules/amc_irb_2026.csv, 정규는 심의일 20일 전 접수마감) · 결과 통보 기한은 비공개라 보완 일정 계산 불가"}
