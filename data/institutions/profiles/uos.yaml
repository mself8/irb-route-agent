id: uos
name: 서울시립대학교 생명윤리위원회
short: 서울시립대
aliases: [서울시립대학교, 서울시립대, 서울시립대학교 생명윤리위원회]
submit: R-BAY(r-bay.co.kr)에서 신청하고 학과 조교를 통해 공문 발송
source: 서울시립대 생명윤리위원회 표준운영지침 Ver.2.3·FAQ v3·R-BAY 공지 (https://r-bay.co.kr/agency/main/QzMzZ2NYdTVrbHUza0lxZG9ZcE40QT09, https://research.uos.ac.kr/institutionalbioethicscommittee, 확인 2026-09-29)
plan_form: 연구계획서(인간대상연구) [별지서식 9-1]
docs:
  신청서: 연구심의 신청서 [별지서식 6] (R-BAY 입력으로 갈음)
  계획서: 연구계획서(인간대상연구) [별지서식 9-1] (가급적 10쪽 이내)
  자료양식: 기록·측정자료 (CRF 등) · 설문지 (해당 시)
  동의서류: 설명문 및 동의서 또는 서면동의면제사유서
  모집문서: 모집 공고문 [별지서식 13] (공개모집 시)
  서약서: 생명윤리준수 서약서 [별지서식 7] (연구진 전원)
  이력서: 연구자 이력서 [별지서식 12] (자유양식 불가, 연구진 전원)
  교육: 생명윤리교육 이수증 (국가생명윤리정책원·R-BAY 교육만, 연구진 전원)
  이해상충: 이해상충공개서 (연구진 전원)
  데이터승인: {name: 데이터 보관 기관의 데이터 허가 공문 (심의면제로 신청할 때), when: [exempt, received_data]}
  면제점검: 심의면제 자가점검표 [별지서식 14-1] (심의면제 신청 시)
  기관서류: 학과 조교를 통한 공문 (없으면 접수 불가)
plan:
  배경·목적: 나. 연구배경 및 연구목적
  선정·제외 기준: 마. 연구대상자 선정, 예상 수, 산출 근거
  대상 수·산출 근거: 마. 연구대상자 선정, 예상 수, 산출 근거
  연구 방법: 사. 연구 방법
  수집 정보 항목: 아. 수집되는 자료 및 정보 등 관찰 항목
  동의 절차: 바. 연구대상자 모집 및 동의 과정
  위험과 이익: 자. 연구대상자의 위험과 이익, 보상
  개인정보 보호대책: 차. 안전대책 및 개인정보보호대책
  분석 방법: 카. 평가 기준 및 방법, 자료 분석 등 통계적 측면
variants:    # 연구 유형·심의면제 신청에 따라 계획서 서식이 다르다 (표준운영지침 제20조·제21조). 먼저 맞는 것을 덮는다
  - when: kind=인체유래물
    plan_form: 연구계획서(인체유래물연구) [별지서식 9-2]
    docs: {계획서: "연구계획서(인체유래물연구) [별지서식 9-2]"}
    plan: {배경·목적: 나. 연구배경 및 연구목적, 선정·제외 기준: 마. 연구대상자 등 선정·예상 수·산출 근거, 대상 수·산출 근거: 마. 연구대상자 등 선정·예상 수·산출 근거,
           동의 절차: 바. 연구대상자 등 모집 및 동의 과정, 수집 방법: 사. 인체유래물 등 수집방법, 연구 방법: 아. 연구 방법,
           수집 정보 항목: 자. 관찰 항목, 분석 방법: 차. 평가 기준 및 방법·통계적 측면, 보관·폐기: 카. 인체유래물 보관 및 폐기 계획,
           위험과 이익: 타. 기증자의 위험과 이익·보상, 개인정보 보호대책: 파. 기증자 안전대책 및 개인정보보호대책}
  - when: exempt
    plan_form: 연구계획서(인간대상연구-심의면제) [별지서식 9-3]
    docs: {계획서: "연구계획서(인간대상연구-심의면제) [별지서식 9-3]"}
rules:
  - id: I-UOS-1
    when: exempt
    level: 확인 필요
    warning: 이 기관 FAQ는 "공공데이터, 오픈데이터만 심의면제에 해당"하고 신규는 심의면제를 포함해 원칙상 정규심의 안건이라고 안내합니다. R-BAY 「심의면제 안내」는 비공개 데이터를 쓰면 보관 기관의 공문이 필요하다고 안내하고, 표준운영지침 제39조는 기존 자료 이용 연구도 면제 확인 대상으로 둡니다. 면제로 신청하기 전에 사무국에 확인하고, 정규심의 일정으로 준비하세요.
    source: 서울시립대 생명윤리위원회 FAQ v3 · R-BAY 공지 「심의면제 안내」 · 표준운영지침 제39조
  - id: I-UOS-2
    when: [exempt, received_data]
    told: [허가 공문, 데이터 허가]
    level: 보완 필요
    warning: 심의면제로 신청하면서 받은 데이터를 쓰면 데이터를 보관한 기관의 데이터 허가 공문이 필요하고, 사용 데이터를 계획서에 자세히 적어야 합니다.
    add_text: 본 연구는 [데이터 보관 기관]으로부터 [데이터 이름·항목·수집 기간]을 제공받아 이용하며, 데이터 보관 기관의 데이터 허가 공문을 첨부한다.
    source: 서울시립대 생명윤리위원회 FAQ v3 (심의면제 관련)
  - id: I-UOS-3
    when: always
    level: 확인 필요
    warning: 교육이수증은 국가생명윤리정책원이나 R-BAY 교육만 인정합니다(교내 연구윤리 교육 이수증은 불가). 이력서·교육이수증·이해상충공개서·서약서는 연구진 전원이 냅니다.
    source: 서울시립대 생명윤리위원회 FAQ v3 · R-BAY 공지
  - id: I-UOS-4
    when: always
    level: 확인 필요
    warning: 학과 조교를 통한 공문 발송이 있어야 접수됩니다. 마감일에 공문이 접수되지 않으면 받지 않으므로 마감 2~3주 전 접수를 권합니다.
    source: 서울시립대 R-BAY 공지 · FAQ v3
exempt_regular: true   # 심의면제도 정규심의 안건이라 7일 빠른 길(가이드라인 표준절차)을 이 기관에서는 쓰지 않는다
schedule: {kind: csv, path: data/schedules/uos_irb_2026.csv, result_days: 14, cycle_days: 25,
           note: "신규는 심의면제 포함 정규심의 안건 (FAQ v3) · 결과 통보 심의일로부터 14일 이내 (SOP 제36조②) · 보완은 다음 차수 정규심의"}
