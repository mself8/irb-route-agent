id: smc
name: 삼성서울병원 기관윤리심의위원회(IRB)
short: 삼성서울병원
aliases: [삼성서울병원, 삼성서울병원 IRB, 삼성서울병원 기관윤리심의위원회]
submit: R-BAY 삼성서울병원 e-IRB(r-bay.co.kr, 로그인 필요)에서 연구책임자가 '신청보고작성 → 신규계획'으로 신청 (서류는 전자파일, 현물서류는 원칙적으로 받지 않음)
source: R-BAY 삼성서울병원 IRB 제출서류 안내·심사비·공지(연구데이터심의위원회(DRB) 시스템 변경 안내 2025-12-15, [IRB] 인체유래물 제공심의 안내 2025-10-24, [IRB] 제출서류 업로드 시 첨부파일 암호화 해제 방법 2024-08-13, [IRB] 동의서 버전관리 및 재동의 관련 문의에 대한 안내 2023-10-20, [IRB] 심사일·심사 결과 관련 문의에 대한 안내 2023-07-04, [IRB] 질의응답집 2023-04-14(첨부 「2023 IRB관련 질의응답」), [IRB] 동의서 인증 절차 및 원내모집공고문 인증 안내 2018-04-30, 개인정보보호법 시행에 따른 동의서 및 증례기록서 작성안내 2012-02-01, 심사면제 및 신속심사 절차 안내 2006-09-06, 2026년 신규과제 정식심의 일정) (https://r-bay.co.kr/agency/main/OVJlRFdsQmpiaGhhdmprTllzR1Z1QT09, 확인 2026-09-30)
plan_form: 임상시험계획서 (구성 요건은 로그인 후 e-IRB 양식함에만 있어 공개 페이지에 없음) · 연구개요 서식 또는 계획서 요약(A4 2쪽 이내)
docs:
  신청서: 연구심의신청서 (e-IRB '신규계획'에서 직접 입력)
  계획서: 임상시험계획서 · 연구개요 서식(e-IRB 입력) 또는 계획서 요약(A4 2쪽 이내)
  자료양식: 증례기록서(CRF) (병원등록번호·주민번호·성명 대신 연구자가 부여한 코드)
  동의서류: 피험자 동의서 또는 피험자 동의서 불필요 사유서 · 피험자에게 제공되는 서면정보(동의서에 설명문을 넣으면 대체 가능)
  모집문서: 피험자 모집관련 서류 (공고문, 매체정보 등 · 해당 시)
  서약서: 연구자 서약서 서명본 (연구책임자와 모든 공동연구자 서명 · 양식은 e-IRB 양식함)
  이력서: 연구책임자 최근 이력(CV) (임상연구·연구윤리·GCP 교육명과 이수일 명시 · 공동연구자 CV는 내지 않음)
  교육: 연구윤리·GCP 교육 이력 (연구책임자 CV에 교육명·이수일로 적음)
  데이터승인: 연구데이터심의위원회(DRB) 승인서 (DRB 대상이면 IRB 종료보고 전까지 IRB에 제출)
  면제점검: 심사면제 요청서 (심사면제 대상일 때, e-IRB 양식함)
rules:
  - id: I-SMC-1
    when: drb
    level: 확인 필요
    warning: 이 기관은 동의면제로 연구데이터를 1만 건(명) 이상 모으거나, 동의면제로 연구데이터(비정형 포함)를 외부에 제공하면 연구데이터심의위원회(DRB) 심의 대상으로 안내합니다. 2026-01-02부터 순서는 IRB 승인 → 데이터 수집 → DRB 신청이고, DRB 승인서는 IRB 종료보고 전까지 IRB에 내야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내 ('26. 1. 2 부터~)」(2025-12-15)
  - id: I-SMC-2
    when: drb
    level: 안내
    warning: DRB 신청은 원내망에서만 열리는 e-DRB 시스템(Knox Portal → SMC Link → e-DRB)에서 '신규심의 신청서'로 하고, 보안서약서·DTA 초안·가명정보 운영 지침 등을 함께 냅니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내 ('26. 1. 2 부터~)」(2025-12-15)
  - id: I-SMC-3
    when: export
    level: 확인 필요
    warning: 동의면제로 연구데이터를 외부에 제공하면 DRB 심의 대상입니다. 데이터 이전 계약(DTA) 등 계약과 DRB 검토는 유관 부서와 따로 협의하라고 안내합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내」(2025-12-15) · 「[IRB] 인체유래물 제공심의 안내」(2025-10-24) 기타사항
  - id: I-SMC-4
    when: always
    check: crf_identifiers
    level: 보완 필요
    warning: 증례기록서(CRF)에는 병원등록번호·주민번호·성명처럼 개인이 드러나는 정보를 쓸 수 없고, 연구자가 부여한 코드(예 Case1)를 써야 합니다. 2012 공지는 성명은 이니셜로, 병원등록번호는 연구자가 부여한 코드로 바꾸고, 전화번호는 지우고, 주소는 간략하게(예 서울시 강남구) 적으라고 안내합니다.
    add_text: "증례기록서(CRF)에는 병원등록번호·주민등록번호·성명·연락처를 적지 않고, 연구자가 부여한 연구대상자 코드(예: Case1)로만 기록한다."
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 4항 · 공지 「개인정보보호법 시행에 따른 동의서 및 증례기록서 작성안내」(2012-02-01)
  - id: I-SMC-5
    when: exempt
    level: 확인 필요
    warning: 심사면제(또는 신속심사)에 해당하면 신규과제와 같은 절차로 e-IRB에 내면서 심사면제 요청서(또는 신속심사 요청서)를 첨부합니다. 요청서 양식은 로그인 후 e-IRB 양식함에 있습니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 14항 · 공지 「심사면제 및 신속심사 절차 안내」(2006-09-06)
  - id: I-SMC-6
    when: always
    level: 안내
    warning: 연구비가 없는 내부 학술연구만 심사비가 면제될 수 있고, 연구비가 있으면 의뢰기관이나 연구책임자에게 청구됩니다. 심사비는 승인 여부와 관계없이 청구됩니다.
    source: R-BAY 삼성서울병원 IRB 심사비
  - id: I-SMC-7
    when: always
    level: 안내
    warning: 첨부파일은 파일명 앞에 순번을 붙이고 압축해 5MB 이내 3개 파일로 내기를 권장합니다. 원내망 PC에서 올려 NASCA 암호가 걸린 파일은 사무국이 접수 전에 반송하니, 암호를 해제한 뒤 올려야 합니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 · 공지 「[IRB] 제출서류 업로드 시, 첨부파일 암호화 해제 방법」(2024-08-13)
  - id: I-SMC-8
    when: always
    level: 확인 필요
    warning: 연구자 서약서는 서명본을 반드시 내야 하고, 서명 범위는 연구책임자와 연구에 참여하는 모든 공동연구자입니다. 이력서(CV)는 연구책임자 것만 내면 되고, 이미 올려 둔 CV가 있으면 다시 내지 않아도 됩니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 제출서류 관련
  - id: I-SMC-9
    when: kind=설문·면담|관찰|중재|인체유래물
    check: recruit_doc
    told: [모집관련 서류, 모집 관련 서류, 모집 공고문, 모집공고문, 모집 문건, 모집문건]
    level: 확인 필요
    warning: 공고문·매체 등으로 연구대상자를 모집하면 피험자 모집관련 서류(공고문, 매체정보 등)를 함께 내야 합니다. 원내에 모집공고문을 게시하려면 최종 승인된 공고문에 IRB 승인 직인을 받은 뒤 게시할 수 있습니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 10항 · 공지 「[IRB] 동의서 인증 절차 및 원내모집공고문 인증 안내」(2018-04-30)
  - id: I-SMC-10
    when: always
    level: 확인 필요
    warning: 연구대상자에게 제공하는 물품 정보·안내문 같은 서류도 IRB 심의를 받아야 하니, 대상자에게 줄 문서가 있으면 함께 내야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 제출서류 관련
  - id: I-SMC-11
    when: kind=설문·면담|관찰|중재|인체유래물
    level: 확인 필요
    warning: 피험자 동의서에는 개인정보의 수집·이용 목적, 보유 및 사용 기간, 수집하려는 항목, 동의를 거부할 권리가 있다는 사실을 적어야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「개인정보보호법 시행에 따른 동의서 및 증례기록서 작성안내」(2012-02-01)
  - id: I-SMC-12
    when: kind=설문·면담|관찰|중재|인체유래물
    level: 안내
    warning: 승인 뒤 연구용 동의서를 받을 때는 최종 승인된 동의서 가운데 IRB 인증(각 페이지 하단 워터마크)이 들어간 동의서를 e-IRB '동의서 인증' 메뉴에서 내려받아 써야 합니다. 동의서가 개정되면 재동의가 원칙이고, 예외가 필요하면 심의 신청 때 사유와 대체안을 함께 내야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 동의서 인증 절차 및 원내모집공고문 인증 안내」(2018-04-30, 워터마크 변경 2025-09-10) · 「[IRB] 동의서 버전관리 및 재동의 관련 문의에 대한 안내」(2023-10-20)
  - id: I-SMC-13
    when: always
    level: 안내
    warning: 연구비 내역서와 계약서는 IRB 심의서류가 아니라서 내지 않습니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 제출서류 관련
  - id: I-SMC-14
    when: always
    level: 확인 필요
    warning: 이 기관은 전향적 연구의 계획서 서식을 따로 제공하지 않습니다. 다국가·국내 다기관 후향적 연구는 IRB 계획서 서식을 꼭 쓰지 않아도 되지만, 공통 계획서에 IRB 심의에 필요한 내용이 모두 들어 있는지 확인해야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 제출서류 관련
  - id: I-SMC-15
    when: always
    level: 확인 필요
    warning: e-IRB에서 '의뢰중'·'의뢰완료' 상태는 연구책임자가 아직 신청하지 않아 IRB에 제출되지 않은 상태입니다. 연구진이 작성을 마쳐도 연구책임자가 직접 신청해야 접수가 시작됩니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 심사진행/eIRB 상황
  - id: I-SMC-16
    when: always
    level: 안내
    warning: 심사결과가 시정승인이나 보완이면, 별도 양식 없이 지적사항마다 답변을 적은 답변서와 고친 서류(계획서·동의서 등)를 냅니다. 고친 서류는 바뀐 부분을 음영 등으로 표시해야 합니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 (시정계획서·보완계획서)
  - id: I-SMC-17
    when: always
    level: 안내
    warning: 신규 정식심사는 따로 정한 접수 마감일이 없고, 대면회의 날짜마다 신규 6~7건 선에서 마감합니다. 공지는 원하는 심사일보다 3주쯤 전에 내라고 안내하고(2026 일정 공지는 3~4주 전, 5/21~10/7 회의는 4~5주 전 신청분이 대상), 사무국은 심의예정일 약 일주일 전에 접수합니다. 심사예정일은 신청서 하단 관리자 코멘트에 적히고, 신청 뒤 1~2일 안에 적히지 않으면 신속심사입니다. 결과는 심사일로부터 최대 일주일 안에(보통 업무일 3일) 받을 수 있고, 신속심사는 들어온 순서대로 접수해 접수일로부터 일주일 안에 심사합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「[IRB] 질의응답집」(2023-04-14) 첨부 「2023 IRB관련 질의응답」 심사일정 관련 · 「[IRB] 심사일, 심사 결과 관련 문의에 대한 안내」(2023-07-04) · 「2026년 신규과제 정식심의 일정」 공지
drb_order: irb_first   # 2026-01-02부터 IRB 승인 → 데이터 수집 → DRB 신청 (I-SMC-1)
schedule: {kind: none, note: "삼성서울병원 2026 신규과제 정식심의 날짜는 공지로 공개(71건, 취소 5·변경 2) · 접수 마감일은 없음('마감일이 별도로 없습니다', 회의마다 신규 6~7건 선에서 마감) · '심의일 기준 3~4주 전(5/21~10/7 회의는 4~5주 전)에 신청된 과제가 심의 대상'이라 날짜로 계산 불가 · 결과는 심사일로부터 최대 일주일 이내(보통 업무일 3일, 2023-07-04 공지), 신속심사는 접수일로부터 일주일 이내 심사"}
forms:       # 공개 페이지에서 이름을 확인한 서식. 제출서류 안내가 '양식함'으로 가리키는 서식은 파일 내용이 로그인해야 보인다
