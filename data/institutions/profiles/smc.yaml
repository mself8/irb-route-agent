id: smc
name: 삼성서울병원 기관윤리심의위원회(IRB)
short: 삼성서울병원
aliases: [삼성서울병원, 삼성서울병원 IRB, 삼성서울병원 기관윤리심의위원회]
submit: R-BAY 삼성서울병원 e-IRB(r-bay.co.kr, 로그인 필요)에서 연구책임자가 '신청보고작성 → 신규계획'으로 신청 (서류는 전자파일, 현물서류는 원칙적으로 받지 않음)
source: R-BAY 삼성서울병원 IRB 제출서류 안내·심사비·공지(연구데이터심의위원회(DRB) 시스템 변경 안내 2025-12-15, 심사면제 및 신속심사 절차 안내, 2026년 신규과제 정식심의 일정) (https://r-bay.co.kr/agency/main/OVJlRFdsQmpiaGhhdmprTllzR1Z1QT09, 확인 2026-09-30)
plan_form: 임상시험계획서 (구성 요건은 로그인 후 e-IRB 양식함에만 있어 공개 페이지에 없음) · 연구개요 서식 또는 계획서 요약(A4 2쪽 이내)
docs:
  신청서: 연구심의신청서 (e-IRB '신규계획'에서 직접 입력)
  계획서: 임상시험계획서 · 연구개요 서식(e-IRB 입력) 또는 계획서 요약(A4 2쪽 이내)
  자료양식: 증례기록서(CRF) (병원등록번호·주민번호·성명 대신 연구자가 부여한 코드)
  동의서류: 피험자 동의서 또는 피험자 동의서 불필요 사유서
  서약서: 연구자 서약서 (e-IRB 양식함)
  이력서: 연구책임자 최근 이력(CV) (임상연구·연구윤리·GCP 교육명과 이수일 명시)
  교육: 연구윤리·GCP 교육 이력 (연구책임자 CV에 교육명·이수일로 적음)
  데이터승인: 연구데이터심의위원회(DRB) 승인서 (DRB 대상이면 IRB 종료보고 전까지 IRB에 제출)
  면제점검: 심사면제 요청서 (심사면제 대상일 때, e-IRB 양식함)
rules:
  - id: I-SMC-1
    when: drb
    level: 확인 필요
    warning: 이 기관은 동의면제로 연구데이터를 1만 건(명) 이상 모으거나, 동의면제로 연구데이터(비정형 포함)를 외부에 제공하면 연구데이터심의위원회(DRB) 심의 대상으로 안내합니다. 2026-01-02부터 순서는 IRB 승인 → 데이터 수집 → DRB 신청이고, DRB 승인서는 IRB 종료보고 전까지 IRB에 내야 합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내 ('26. 1. 2 부터~)」
  - id: I-SMC-2
    when: drb
    level: 안내
    warning: DRB 신청은 원내망에서만 열리는 e-DRB 시스템(Knox Portal → SMC Link → e-DRB)에서 '신규심의 신청서'로 하고, 보안서약서·DTA 초안·가명정보 운영 지침 등을 함께 냅니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내 ('26. 1. 2 부터~)」
  - id: I-SMC-3
    when: export
    level: 확인 필요
    warning: 동의면제로 연구데이터를 외부에 제공하면 DRB 심의 대상입니다. 데이터 이전 계약(DTA) 등 계약과 DRB 검토는 유관 부서와 따로 협의하라고 안내합니다.
    source: R-BAY 삼성서울병원 IRB 공지 「연구데이터심의위원회(DRB) 시스템 변경 안내」 · 「[IRB] 인체유래물 제공심의 안내」 기타사항
  - id: I-SMC-4
    when: always
    level: 확인 필요
    warning: 증례기록서(CRF)에는 병원등록번호·주민번호·성명처럼 개인이 드러나는 정보를 쓸 수 없고, 연구자가 부여한 코드(예 Case1)를 써야 합니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 4항 · 공지 「개인정보보호법 시행에 따른 동의서 및 증례기록서 작성안내」
  - id: I-SMC-5
    when: exempt
    level: 확인 필요
    warning: 심사면제(또는 신속심사)에 해당하면 신규과제와 같은 절차로 e-IRB에 내면서 심사면제 요청서(또는 신속심사 요청서)를 첨부합니다. 요청서 양식은 로그인 후 e-IRB 양식함에 있습니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내 14항 · 공지 「심사면제 및 신속심사 절차 안내」
  - id: I-SMC-6
    when: always
    level: 안내
    warning: 연구비가 없는 내부 학술연구만 심사비가 면제될 수 있고, 연구비가 있으면 의뢰기관이나 연구책임자에게 청구됩니다. 심사비는 승인 여부와 관계없이 청구됩니다.
    source: R-BAY 삼성서울병원 IRB 심사비
  - id: I-SMC-7
    when: always
    level: 안내
    warning: 첨부파일은 파일명 앞에 순번을 붙이고 압축해 5MB 이내 3개 파일로 내기를 권장합니다.
    source: R-BAY 삼성서울병원 IRB 제출서류 안내
drb_order: irb_first   # 2026-01-02부터 IRB 승인 → 데이터 수집 → DRB 신청 (I-SMC-1)
schedule: {kind: none, note: "삼성서울병원 2026 신규과제 정식심의 날짜는 공지로 공개(71건, 취소 5·변경 2) · 접수 마감일은 없고 '심의일 기준 3~4주 전(5/21~10/7 회의는 4~5주 전)에 신청된 과제가 심의 대상' → 계산 불가 · 결과 통보 기한은 공개 수치 없음"}
