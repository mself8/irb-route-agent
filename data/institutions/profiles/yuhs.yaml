id: yuhs
name: 세브란스병원 연구심의위원회(IRB)
short: 세브란스병원
aliases: [세브란스병원, 신촌세브란스병원, 연세대학교 세브란스병원, 연세대학교 의과대학 세브란스병원, 세브란스병원 연구심의위원회]
submit: e-IRB(eirb.yuhs.ac, 로그인 필요)에서 신규과제 심의신청 (연구자·의뢰자 등 회원가입 후 이용)
source: 세브란스병원 임상연구보호센터 IRB 심의 종류·심의 대상 및 흐름도·심의 일정·심의비·연구자 자격요건, 연세대학교 의료원 개인정보처리방침(2026-09-22 시행) (https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType, 확인 2026-09-30)
plan_form: 연구계획서 (기관 서식·항목은 e-IRB 로그인 후에만 보여 공개 페이지에 없음)
docs:
  신청서: 신규과제 e-IRB 심의신청
  계획서: 연구계획서
  자료양식: 증례기록서 (후향적 의무기록연구도 필수)
  모집문서: 대상자모집 공고안 (해당 시)
  동의서류: 대상자 설명문 및 동의서 또는 대상자 동의(서) 면제 사유서 (후향적 의무기록연구는 설명문·동의서 불필요)
  이력서: 연구책임자 이력 및 경력
  교육: GCP·생명윤리 교육 이수 (연구진 전원, 최소 2년에 1회 · 이수 후 심의 의뢰)
rules:
  - id: I-YUHS-1
    when: exempt
    level: 확인 필요
    warning: 심의면제 대상이어도 IRB에 '면제심의' 절차로 신청해 면제 여부를 확인받아야 합니다. 신규과제는 정규심의가 원칙이라, IRB가 면제·신속심의 대상으로 확인하지 않으면 정규심의로 진행될 수 있습니다.
    source: 세브란스병원 IRB 심의 대상 및 흐름도 · IRB 심의 종류 (HRPP Procedure Domain III-6)
  - id: I-YUHS-2
    when: always
    level: 확인 필요
    warning: 연구책임자·연구담당자·코디네이터 등 연구진 전원이 최소 2년에 1회 연구윤리 교육을 이수해야 하고, 교육 이수 후에 심의를 의뢰할 수 있습니다. 2026년에 참여하면 2025~26년 교육 이력이 있어야 합니다.
    source: 세브란스병원 임상연구보호센터 연구자 자격요건 · IRB 심의 종류
  - id: I-YUHS-3
    when: always
    level: 안내
    warning: 인정 교육은 식약처 지정 교육실시기관의 임상시험 종사자 교육, 임상연구보호센터 GCP·생명윤리 교육과 IRB 워크숍, KAIRB·KoNECT 등 협회 교육, NIH·CITI 온라인 교육, 질병관리청·공용기관생명윤리위원회 연구윤리 교육입니다.
    source: 세브란스병원 임상연구보호센터 연구자 자격요건 (임상연구자 교육)
  - id: I-YUHS-4
    when: drb
    level: 확인 필요
    warning: 연세대학교 의료원 개인정보처리방침은 연구용 가명처리 항목을 IRB(연구심의위원회)와 DRB(데이터활용심의위원회)가 승인한 항목으로 적고 있습니다. DRB 신청 창구와 IRB와의 순서는 공개 페이지에 없으니 사무국에 확인하세요.
    source: 연세대학교 의료원 개인정보처리방침 8. 가명정보의 처리에 관한 사항 (2026-09-22 시행)
  - id: I-YUHS-5
    when: always
    level: 안내
    warning: 시정승인·보완 결과를 받으면 답변서와 고친 서류를 심의일로부터 6개월 안에 내야 하고, 최종 승인 전에는 연구를 시작할 수 없습니다.
    source: 세브란스병원 IRB 심의 종류 (심의 결과·심의결과에 대한 답변, HRPP Domain III-4-2)
  - id: I-YUHS-6
    when: always
    level: 안내
    warning: 연구비 지원이 없는 학술연구·후향적 연구와 교내·개인 연구비 연구는 심의접수료를 병원이 부담합니다. 영리기관 연구비가 있으면 심의비 표에 따라 냅니다.
    source: 세브란스병원 IRB 심의비
  - id: I-YUHS-7
    when: always
    level: 확인 필요
    warning: "이 위원회의 신규과제 제출 서류표는 임상시험·설문조사·시판 후 사용성적조사·후향적 의무기록연구·인체유래물연구 모두에서 연구계획서·증례기록서·연구책임자 이력 및 경력을 '반드시 제출'로 표시합니다. 설문조사나 기록 연구라도 증례기록서를 따로 준비해야 합니다."
    source: 세브란스병원 임상연구보호센터 「IRB 심의 종류」 신규과제 제출 서류 안내 · 「신규과제 제출 시 필요한 서류 목록」 (확인 2026-09-30)
  - id: I-YUHS-8
    when: kind=기록 이용
    level: 확인 필요
    warning: "제출 서류표에서 후향적 의무기록연구는 대상자 설명문 및 동의서가 '제출 불필요'로 표시돼 있습니다. 다만 필수 서류 3번이 '대상자 설명문 및 동의서 또는 대상자 동의(서) 면제 사유서'라서, 동의를 받지 않는 기록 연구에 동의(서) 면제 사유서가 필요한지는 IRB 지원 창구(irb@yuhs.ac)에 확인하는 것이 좋습니다."
    source: 세브란스병원 임상연구보호센터 「IRB 심의 종류」 신규과제 제출 서류 안내 필수 3 · 「신규과제 제출 시 필요한 서류 목록」 후향적 의무기록연구 열 (확인 2026-09-30)
  - id: I-YUHS-9
    when: kind=설문·면담|관찰|중재|인체유래물
    check: recruit_doc
    told: [모집 문건, 모집문건, 모집 공고안, 모집공고안, 모집 공고문, 모집공고문]
    level: 확인 필요
    warning: "포스터·게시판·SNS 글 등으로 대상자를 모집하면 그 모집문건(대상자모집 공고안)을 함께 내야 할 수 있습니다. 이 위원회의 제출 서류표는 임상시험·설문조사·인체유래물연구에서 대상자 모집문건을 '해당하는 경우 제출'로 적고 있습니다."
    source: 세브란스병원 임상연구보호센터 「IRB 심의 종류」 신규과제 제출 서류 안내 기타 7 · 「신규과제 제출 시 필요한 서류 목록」 대상자 모집문건 행 (확인 2026-09-30)
  - id: I-YUHS-10
    when: kind=인체유래물
    level: 확인 필요
    warning: "인체유래물연구는 생명윤리법 시행규칙 별지 제34호 서식(인체유래물연구 동의서)과 함께 구체적인 설명을 담은 Main 대상자 설명문을 내야 합니다. 동의면제가 되는 경우는 예외입니다."
    source: 세브란스병원 임상연구보호센터 「IRB 심의 종류」 「신규과제 제출 시 필요한 서류 목록」 인체유래물연구 주석 (확인 2026-09-30)
drb_order: unknown   # DRB 신청 창구와 IRB와의 순서는 공개 페이지에 없음
schedule: {kind: none, note: "세브란스병원 2026 정규심의 날짜·접수마감은 공개 달력에 있음(일반 위원회 6곳 72회, data/schedules/yuhs_irb_2026.csv) · 결과 통보 기한은 공개 수치 없음 → 계산 불가 · 위원회는 과제마다 지정, 신속심의는 위원회별 매주"}
forms:       # 「IRB 심의 종류」의 신규과제 제출 서류 안내(필수 1~5·기타 6~11)와 「신규과제 제출 시 필요한 서류 목록」 표에 이름만 공개. 서식 번호·버전·파일은 e-IRB 로그인 뒤라 비공개(별지 제34호는 법정 서식). 면제심의 신청 서식은 공개 목록에 없음
  - {name: "신규과제 e-IRB 심의신청 (필수 1, e-IRB에서 작성)", doc: 신청서, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "연구계획서 (필수 2, 모든 연구 유형 반드시 제출)", doc: 계획서, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "대상자 설명문 및 동의서 (필수 3, 후향적 의무기록연구는 제출 불필요로 표시)", doc: 동의서류, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "대상자 동의(서) 면제 사유서 (필수 3, 설명문 및 동의서 대신)", doc: 동의서류, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "증례기록서 (필수 4, 모든 연구 유형 반드시 제출)", doc: 자료양식, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "연구책임자 이력 및 경력 (필수 5, 모든 연구 유형 반드시 제출)", doc: 이력서, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "대상자모집 공고안·대상자 모집문건 (기타 7, 임상시험·설문조사·인체유래물연구에서 해당 시)", doc: 모집문서, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "인체유래물연구 동의서 (인체유래물연구, Main 대상자 설명문과 함께)", number: "생명윤리법 시행규칙 별지 제34호", doc: 동의서류, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "개인정보활용동의서 (시판 후 사용성적조사에서 해당 시)", doc: 동의서류, url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "연구비소요내역서 (기타 6, 해당 시)", url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "피해보상규약 사본 (기타 8, 임상시험)", url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "임상시험자 자료집(Investigator's Brochure) (기타 9, 임상시험)", url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "제조(수입)품목 허가증 사본 (기타 10, 해당 시)", url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
  - {name: "식품의약품안전처 임상시험계획승인서 (기타 11, 임상시험은 식약처 승인 후 제출)", url: "https://ocr.yuhs.ac/HPC/Sinchon/IRB/IrbReviewType"}
