id: snuh
name: 서울대학교병원 IRB (서울의대·서울대병원 통합 HRPP)
short: 서울대병원
aliases: [서울대병원, 서울대학교병원, 서울대학교 병원]
submit: e-IRB CRIS(https://cris.snuh.org)에서 기초과제를 등록하고 연구계획 심의의뢰서를 작성해 책임연구자가 확인·제출 (책임연구자는 과제당 1명, 접수처 IRB지원실. 작성 절차는 2025-08 사본 기준)
source: 서울대병원 HRPP 사이트(2026-08-07 개편 · 연구의 계획·심의 절차·교육 정책·2026 정규회의 일정)·HRPP 뉴스레터 56호(2023-10-19 · 가명정보 활용 후향적 연구 정책, 연구계획서 서식 5)·61호(2025-08-14 · 연구대상자 모집공고문 작성 기준)·62호(2026-09-23 게시 · 연구자 자율점검표_모집 공고문 v1.0)·교육 자료실 「[교육정책] 참여 연구 종류에 따른 필수 교육 안내」(2026-08-01) (https://hrpp.snuh.org, 뉴스레터 https://hrpp.snuh.org/hrpp/bbs/list.do?key=2605277036, 확인 2026-09-30)
plan_form: 연구계획서 서식 5 (CDW 연구검색 시스템 활용 연구계획서, 2023.10.01 제정 · CDW 가명정보 연구 신규과제 필수)
docs:
  신청서: 연구계획심의의뢰서 (심의면제는 심의면제의뢰서 · CRIS에서 작성)
  계획서: 연구계획서 서식 5 (CDW 가명정보 연구) · 그 밖의 연구 서식은 비공개(로그인)
  자료양식: 데이터 수집 양식 (서식 5 별첨 1 · 실제 쓸 형태로 제출)
  동의서류: 연구대상자 설명문 및 동의서 (서식 번호 비공개)
  모집문서: 연구대상자 모집공고문 (모집공고문을 쓸 때 · 게시 장소·매체·공고 내용을 함께 IRB 심의)
  이력서: 책임연구자 이력 (서식 5 별첨 2 · 연구윤리 교육 이수 내용 포함)
  교육: 임상연구윤리교육 이수증 (매년 · CRIS에 등록)
  면제점검: 심의면제 대상 체크리스트 (CDW 가명정보 연구 · 뉴스레터 56호)
  기관서류: 심의료 납부 확인 · CRIS 기초과제 등록
plan:
  배경·목적: 8. 연구의 배경 및 목적
  선정·제외 기준: 9-1. 연구 대상 선정 기준 (제외 기준 칸은 따로 없음)
  대상 수·산출 근거: 9-2. 연구대상자수 (CDW에서 조회한 대략의 대상자수)
  연구 방법: 9. 연구 방법
  수집 정보 항목: 9-3. 연구 데이터 항목 (별첨 1 데이터 수집 양식)
  개인정보 보호대책: 10-2. 개인정보보호
  보관·폐기: 10-2. 개인정보보호 (연구 종료 후 3년 보관 뒤 파기)
  분석 방법: 9-4. 연구 데이터 분석 및 활용 방법
rules:
  - id: I-SNUH-1
    when: drb
    level: 확인 필요
    warning: 이 기관의 CDW 가명정보 연구는 정형 데이터 10,000건 이상 또는 비정형 데이터 1,000건 이상을 추출하거나 외부로 반출하면, IRB 심의 뒤에 데이터심의위원회(DRB) 추가 심의가 필요합니다. IRB가 먼저, DRB가 나중입니다.
    source: HRPP 뉴스레터 56호(2023-10-19) 가명정보 활용 후향적 연구 정책
  - id: I-SNUH-2
    when: exempt
    level: 확인 필요
    warning: 가명정보만 받아 하는 연구는 대개 심의면제 대상이지만, 병록번호가 있는 기존 데이터와 연계하거나 대량 추출·외부 반출이 있으면 심의면제가 아니라 심의(연구계획심의의뢰서) 대상이 될 수 있습니다. 해당이 없으면 심의면제의뢰서를 냅니다.
    source: HRPP 뉴스레터 56호 심의면제 대상 체크리스트
  - id: I-SNUH-3
    when: export
    told: [반출 기관, 전달방법, 전달 방법]
    level: 보완 필요
    warning: 데이터를 외부로 반출하면 계획서에 반출 기관·반출 데이터·데이터 전달방법을 적어야 하고, 건수와 관계없이 DRB 추가 심의가 필요합니다.
    add_text: "반출 기관: [기관명] · 반출 데이터: [항목] · 데이터 전달방법: [방법]"
    source: 연구계획서 서식 5(2023.10.01) · 뉴스레터 56호
  - id: I-SNUH-4
    when: drb
    level: 확인 필요
    warning: 이 기관은 CDW(가명정보) 연구의 신규 과제를 연구계획서 서식 5로만 접수합니다. 임상시험·전향적 연구는 별도 서식을 씁니다.
    source: 연구계획서 서식 5 안내(뉴스레터 56호 붙임 1)
  - id: I-SNUH-5
    when: always
    level: 확인 필요
    warning: "모든 연구자는 참여하는 연구 종류에 맞는 교육을 매년 1회 이상 이수해야 합니다. 임상시험이 아닌 임상연구는 임상연구윤리·생명윤리법 관련 교육(또는 GCP·의약품 임상시험 종사자교육)을 이수합니다. 본원에서 하지 않은 교육의 수료증은 CRIS에 등록해 두어야 IRB가 확인할 수 있습니다."
    source: "HRPP 교육 정책(https://hrpp.snuh.org/hrpp/content.do?key=2605277016) · 교육 자료실 「[교육정책] 참여 연구 종류에 따른 필수 교육 안내」(2026-08-01, 2021-09에 기한 3년→매년)"
  - id: I-SNUH-6
    when: always
    level: 안내
    warning: 심의료 납부가 확인돼야 연구계획서를 접수합니다. 연구자 주도 연구는 연구비 2천만원 초과 30만원·이하 10만원이고 심의면제 연구는 면제입니다. 정규회의 안건은 회의 2주 전에 접수를 마감합니다.
    source: HRPP 심의 절차 안내(https://hrpp.snuh.org/hrpp/content.do?key=2608270001) · 2026년도 IRB 정규회의 일정 공지
  - id: I-SNUH-7     # period_before_review는 공개 결과 통보 일수가 있어야 판정하므로(schedule kind: none) told로 본다
    when: always
    told: [승인일, 승인 후, 승인 이후, 면제 확인]
    level: 보완 필요
    warning: "이 기관은 IRB 승인이나 심의면제 확인 없이 연구를 시작할 수 없다고 안내하고, 연구계획서 서식 5는 예상 연구기간을 'IRB 승인일 이후부터' 적게 합니다. 연구기간을 승인 전 날짜부터 적으면 승인 전에 연구를 시작하는 것으로 보일 수 있습니다."
    add_text: "예상 연구기간: IRB 승인일로부터 [YYYY년 MM월 DD일]까지"
    source: "HRPP 「연구의 계획」(https://hrpp.snuh.org/hrpp/content.do?key=2608270002) · 연구계획서 서식 5(2023.10.01 제정) 6. 예상 연구기간"
  - id: I-SNUH-8
    when: drb
    check: english_title
    level: 보완 필요
    warning: "CDW 가명정보 연구에 쓰는 연구계획서 서식 5는 표지에 연구계획서 제목을 국문과 영문으로 함께 적게 합니다. 계획서에 영문 제목을 적어 두어야 합니다."
    add_text: "연구계획서 제목 (영문): [English title]"
    source: "연구계획서 서식 5(2023.10.01 제정) 표지 · HRPP 뉴스레터 56호(2023-10-19) 붙임 1"
  - id: I-SNUH-9
    when: drb
    told: [재식별]
    level: 보완 필요
    warning: "서식 5의 개인정보보호 칸에는 의료데이터를 모두 대체식별번호로 관리한다는 점, 재식별을 시도하지 않는다는 점, 물리적으로 제한된 공간 등에서 분석한다는 점을 넣으라고 안내합니다."
    add_text: "연구에 활용하는 의료데이터는 모두 대체식별번호로 관리하며, 연구자가 가진 다른 정보와 결합하여 재식별을 시도하지 않는다. 데이터는 암호가 설정된 파일로 저장하여 잠금 장치가 있는 연구실과 컴퓨터에 보관하고 분석한다."
    source: "연구계획서 서식 5(2023.10.01 제정) 10-2) 연구대상자의 개인정보보호"
  - id: I-SNUH-10
    when: drb
    told: [생명윤리]
    level: 보완 필요
    warning: "서식 5의 '연구의 윤리성 확보 방안' 칸에는 개인정보보호법과 생명윤리 및 안전에 관한 법률을 지켜 연구하겠다는 내용을 넣으라고 안내합니다."
    add_text: "본 연구는 「개인정보 보호법」과 「생명윤리 및 안전에 관한 법률」을 준수하여 수행한다."
    source: "연구계획서 서식 5(2023.10.01 제정) 10-1) 연구의 윤리성 확보 방안"
  - id: I-SNUH-11
    when: drb
    told: [3년]
    level: 보완 필요
    warning: "서식 5는 연구 관련 기록을 연구 종료 시점부터 3년간 보관하고, 보관 기간이 지난 개인정보는 개인정보 보호법 시행령 제16조에 따라 파기하라고 안내합니다. 후속 연구 등으로 3년 넘게 보관하려면 그 계획을 적습니다."
    add_text: "연구 관련 기록은 연구 종료 시점부터 3년간 보관하며, 보관 기간이 지나면 개인정보는 「개인정보 보호법 시행령」 제16조에 따라 파기한다."
    source: "연구계획서 서식 5(2023.10.01 제정) 10-2) 연구대상자의 개인정보보호"
  - id: I-SNUH-12
    when: drb
    level: 확인 필요
    warning: "서식 5는 해당 사항이 없는 칸에 '해당 없음'을 적게 합니다. 연구대상자수는 CDW에서 조회한 대략의 수를 쓰되 연구계획심의의뢰서의 대상자수와 같아야 하고, IRB는 계획서의 연구 데이터 항목과 별첨 데이터 수집 양식(CRF)의 항목이 일치하는지 봅니다. 데이터 수집 양식은 실제 쓸 형태로 내고, 책임연구자 이력에는 연구윤리 등 교육 이수 내용을 적습니다."
    source: "연구계획서 서식 5(2023.10.01 제정) 머리말·9-2)·9-3)·별첨 서류"
  - id: I-SNUH-13
    when: kind=설문·면담|관찰|중재|인체유래물
    check: recruit_doc
    told: [모집 공고문, 모집공고문, 모집 문건, 모집문건]
    level: 확인 필요
    warning: "이 기관은 연구대상자 모집 계획과 절차를 연구계획서에 자세히 적고, 모집공고문을 쓰면 게시할 장소·매체·공고 내용까지 IRB 심의를 받으라고 안내합니다. IRB 승인을 받지 않은 매체에 게시하거나 승인받은 것과 다른 공고문을 쓰면 안 되고, 모집 방법이나 문구를 바꾸려면 변경 승인을 받아야 합니다. 이메일로 모집하면 이메일 주소를 어떻게 모을지도 적습니다."
    add_text: "연구대상자는 IRB 승인을 받은 모집공고문을 [게시 장소·매체(예: 원내 지정 게시판, 웹페이지 주소)]에 게시하여 모집한다."
    source: "HRPP 뉴스레터 61호 「연구대상자 모집공고문 작성 기준 안내」(2025-08-14) · 뉴스레터 62호 「연구자 자율점검표_모집 공고문」 v1.0(2026-09-23 게시) 1·4·5·7번"
  - id: I-SNUH-14
    when: kind=설문·면담|관찰|중재|인체유래물
    level: 확인 필요
    warning: "모집공고문에는 책임연구자 또는 연구담당자 이름과 연구 수행 기관, 연구 목적과 제목, 간략한 자격 요건, 참여에 드는 시간이나 노력, 문의 연락처를 넣을 수 있습니다. 동의서·계획서보다 과장된 이익, 법적 권리를 포기하게 하거나 책임을 피하는 문구, 사례비를 굵거나 크게 강조하는 것, 비용으로 현혹하는 문구, '무료 치료'라는 말은 넣지 않아야 합니다. 의약품·의료기기 임상시험은 '신약'·'신치료법'·'알바비'·'인센티브' 같은 말도 쓰지 않습니다."
    source: "HRPP 뉴스레터 61호 「연구대상자 모집공고문 작성 기준 안내」(2025-08-14) 1·2 · 뉴스레터 62호 자율점검표(2026-09-23 게시) 10~12번"
  - id: I-SNUH-15
    when: kind=설문·면담|관찰|중재|인체유래물
    level: 안내
    warning: "서울대병원 원내 오프라인 게시는 지정된 게시판(본관·어린이병원·의생명연구원·암병원·의학연구혁신센터)에만 할 수 있고, 게시물을 담당 부서에 가져가 문서통제 도장을 받은 뒤 게시하며 모집이 끝나면 제거합니다. 아르바이트 사이트처럼 아르바이트로 오인될 수 있는 모집 매체는 쓰지 않아야 합니다. 임상연구윤리센터 QA실이 원내 모집공고문을 매년 모니터링합니다."
    source: "HRPP 뉴스레터 61호(2025-08-14) 서울대학교병원 오프라인 게시판 안내 · 뉴스레터 62호 자율점검표(2026-09-23 게시) 7번"
