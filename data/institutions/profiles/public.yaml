    warning: "설명문의 각 항목은 연구계획서와 같게 적고, 전문 용어를 줄여 쉬운 말로 써야 합니다. 반드시 참여해야 한다는 오해가 없게 쓰고, 금전 보상은 이익이 아닌 보상 항목에 참여 유인이 되지 않을 정도로 적으며, 녹음·녹화가 있으면 별도 체크박스로 추가 동의를 받도록 권고합니다. 아동은 만 0~6세 법정대리인 서면동의, 만 7~12세 법정대리인 서면동의와 본인 승낙서(권고서식 제40·41호), 만 13~18세 법정대리인과 본인 서면동의를 받습니다."
