  선정·제외 기준: 7. 수집하려는 개인 정보 ② 선정 및 제외 기준
  대상 수·산출 근거: 8. 선정 및 산출 근거
  연구 방법: 9. 연구 방법
  수집 정보 항목: 7. 수집하려는 개인 정보 ①
  수집 방법: 9. 연구 방법 ② 제공 기관·제공 절차
  동의 절차: 9. 연구 방법 ① 모집 절차
  위험과 이익: 13. 연구대상자의 위험과 이익
  개인정보 보호대책: 9. 연구 방법 ③④ 가명처리 주체·방법
  보관·폐기: 11. 정보의 보관 및 폐기
  제3자 제공: 11. 정보의 보관 및 폐기 ② 2차 사용·제3자 제공 계획
  분석 방법: 12. 자료 분석과 통계적 방법
variants:    # 연구 유형(F01)마다 권고서식이 다르다. 먼저 맞는 것을 위 기본값(제37호, 기록 이용) 위에 덮는다
  - when: kind=설문·면담
    plan_form: 연구계획서 권고서식 제33호 (인간대상연구 조사연구용)
    docs: {계획서: 연구계획서 권고서식 제33호}
    plan: {배경·목적: 1. 연구 배경 · 2. 연구 목적, 선정·제외 기준: 7. 연구대상자, 대상 수·산출 근거: 8. 예상 연구대상자 수와 산출 근거,
           동의 절차: 9. 연구대상자 모집 · 10. 연구대상자 동의, 연구 방법: 11. 연구 방법, 수집 정보 항목: 12. 관찰 항목,
           분석 방법: 13. 자료 분석과 통계적 방법, 위험과 이익: 15. 연구대상자의 위험과 이익, 개인정보 보호대책: 17. 연구대상자 안전대책 및 개인 정보 보호}
  - when: kind=중재|관찰
    plan_form: 연구계획서 권고서식 제32호 (인간대상연구 실험연구용)
    docs: {계획서: 연구계획서 권고서식 제32호}
    plan: {배경·목적: 1. 연구 배경 · 2. 연구 목적, 선정·제외 기준: 7. 연구대상자, 대상 수·산출 근거: 8. 예상 연구대상자 수와 산출 근거,
           동의 절차: 9. 연구대상자 모집 · 10. 연구대상자 동의, 연구 방법: 11. 연구 방법, 수집 정보 항목: 12. 관찰 항목,
           분석 방법: 15. 자료 분석과 통계적 방법, 위험과 이익: 17. 연구대상자의 위험과 이익, 개인정보 보호대책: 19. 연구대상자 안전대책 및 개인 정보 보호}
  - when: kind=인체유래물
    plan_form: 연구계획서 권고서식 제34호 (인체유래물연구용)
    docs: {계획서: 연구계획서 권고서식 제34호}
    plan: {배경·목적: 1. 연구 배경 · 2. 연구 목적, 선정·제외 기준: 7. 인체유래물 기증자, 대상 수·산출 근거: 8. 인체유래물 기증자 수와 산출 근거,
           수집 방법: 9. 인체유래물등 수집 방법, 동의 절차: 10. 인체유래물 기증자의 동의, 연구 방법: 11. 연구 방법, 수집 정보 항목: 12. 평가 항목,
           보관·폐기: 13. 인체유래물등 보관 및 폐기 방법, 위험과 이익: 14. 인체유래물 기증자의 위험과 이익, 개인정보 보호대책: 16. 인체유래물 기증자 안전대책 및 개인정보 보호}
rules:
  - id: I-PUB-1
    when: received_data
    level: 확인 필요
    warning: 공용위원회 제출서류 안내의 '개인정보의 제공 심의' 항목은 "연구목적으로 수집되지 않은 개인정보의 제공은 개인정보보호법에 따라 데이터심의위원회의 심의를 받아야 합니다"라고 적고 있습니다. 데이터를 받는 연구라면 제공 기관의 DRB 절차와 승인서를 확인하세요.
    source: 공용위원회 e-IRB 제출서류 안내 PT0103R02 (개인정보의 제공 심의)
  - id: I-PUB-2
    when: always
    level: 확인 필요
    warning: 연구진 전원의 연구이력·교육이수를 e-IRB에 입력해야 하고, 교육이수증은 최근 2년 이내 것만 됩니다. 행정점검에서 서류가 모자라면 30일 안에 내야 합니다.
    source: 공용위원회 e-IRB 제출서류 안내 PT0103R02 · SOP ver5.5 제31조③
  - id: I-PUB-3
    when: always
    check: past_tense
    level: 보완 필요
    warning: "공용위원회는 심의를 받지 않고 이미 수행 중이거나 수행을 마친 연구의 사후 심의(또는 면제)는 할 수 없다고 안내합니다. 연구 행위를 '모집하였다·분석하였다'처럼 과거형으로 쓰면 이미 진행된 연구로 보일 수 있으니, 앞으로 할 일(현재·미래 시점)로 써야 합니다. 승인 뒤에 승인 전 연구 수행 사실이 발견되면 '승인 취소 및 기관장과 학회지에 통보'될 수 있다고 안내합니다."
    source: "공용위원회 FAQ 모음집(2025.12, 자료실 2026-02-09) 심의신청 1 「사전심의 원칙」 · 이용 안내서 v1.4(2024-09-27) Ⅲ-1 승인된 범위 내 연구 수행"
  - id: I-PUB-4
    when: always
    check: sample_size_rationale
    told: [산출 근거, 산출근거]
    level: 보완 필요
    warning: "연구계획서에 예상 연구대상자 수와 산출 근거를 적어야 합니다. 권고서식은 대상자를 직접 모집하면 중도 탈락률을 고려한 대상자 수와 산출 근거를 필수로 적고, 통계학적 산출이나 선행연구에 근거하게 합니다. 통계적 수치를 내기 어려운 질적 연구는 유사한 논문 등으로 근거를 댈 수 있고, 스크리닝(선별검사)이 있으면 스크리닝 탈락·중도탈락을 포함한 탈락률로 산출하도록 안내합니다. 개인정보 이용 연구(제37호)는 필요한 정보의 내용·수량과 근거를 적고, 그 수는 필요한 결과를 얻을 수 있는 최소한이어야 합니다."
    add_text: "예상 연구대상자 수: [N]명. 산출 근거: [통계학적 산출(효과크기·유의수준·검정력) 또는 선행연구·유사 논문]에 따라 분석에 필요한 [n]명에 중도 탈락률 [x]%를 반영하여 [N]명으로 정한다."
    source: "권고서식 제32·33호 ver 4.0 「8. 예상 연구대상자 수와 산출 근거」 · 제37호 ver 2.0 「8. 선정 및 산출 근거」(자료실 2026-08-03 게시) · 이용 안내서 v1.4 Ⅵ-1 ⑤ · FAQ 모음집(2025.12) 승인 후 과제관리 16 「미준수 보고 – 목표 연구대상자 수 산출 범위」 · SOP ver5.5 제21조②1호"
  - id: I-PUB-5
    when: always
    check: period_before_review
    level: 보완 필요
    warning: "연구기간은 승인일(심의면제는 면제 확인일)부터 시작하도록 적어야 합니다. 권고서식은 연구 소요 예상 기간을 '승인일로부터 ~ 00년 00월 00일'(제37호는 '승인일(또는 면제 확인일)로부터')로 적고, e-IRB 신규 심의 신청서의 연구 수행 예정기간과 같게 적게 합니다. 이용 안내서도 연구 기간을 심의 소요일을 고려해 실제로 진행 가능한 기간으로 적고, 반드시 승인 후 연구를 수행해야 한다고 안내합니다."
    add_text: "연구기간: 공용위원회 승인일(심의면제는 면제 확인일)로부터 [YYYY년 MM월 DD일]까지"
    source: "권고서식 제32·33호 ver 4.0·제34호 ver 4.1 「6. 연구기간」 · 제37호 ver 2.0 「6. 연구 기간」(자료실 2026-08-03 게시) · 이용 안내서 v1.4 Ⅵ-1 ④ · Ⅲ-1"
  - id: I-PUB-6
    when: kind=설문·면담|관찰|중재|인체유래물
    check: recruit_doc
    told: [모집 문건, 모집문건, 모집공고문, 모집 공고문, 모집관련 문서, 모집 관련 문서]
    level: 확인 필요
    warning: "모집공고문 등으로 대상자를 모집하면 연구대상자 모집 관련 문서를 함께 내야 합니다. 제출서류 안내는 실험·조사연구와 직접 수집하는 인체유래물연구에 모집 관련 문서를 두고, 권고서식은 선정·제외 기준을 모집 문건에도 같게 적게 합니다. 승인되면 공용위원회 직인이 찍힌 모집공고문·설명문·동의서만 써야 합니다."
    source: "e-IRB 제출서류 안내(PT0103R02) · SOP ver5.5 제21조②4호 · 권고서식 제33호 ver 4.0 「7. 연구대상자」②·제34호 ver 4.1 「9. 인체유래물등 수집 방법」② · 이용 안내서 v1.4 Ⅲ-1"
  - id: I-PUB-7
    when: exempt
    check: crf_identifiers
    level: 확인 필요
    warning: "개인식별정보를 수집·이용하는 연구는 심의면제로 신청할 수 없다고 안내합니다. 개인식별정보는 성명·주민등록번호 등 개인을 직접 식별하거나 유추할 수 있는 모든 정보이고, 심의면제 신청 화면에서 수집 여부를 고릅니다. 다만 동의서에 성명을 적게 하는 것만으로는 개인식별정보를 수집하는 연구로 보지 않는다고 FAQ가 안내합니다. 연구 자료에 식별정보를 기록한다면 면제가 아닌 심의 신청 대상인지 사무국에 확인하세요."
    source: "이용 안내서 v1.4 p.11 심의면제 신청 화면 ⑦(개인식별정보 포함 여부) · FAQ 모음집(2025.12) 심의신청 24 「연구계획 – 개인식별정보 수집 해당 여부」"
  - id: I-PUB-8
    when: received_data
    told: [2차 사용, 2차적 사용, 2차 이용, 2차적 이용]
    level: 보완 필요
    warning: "이미 수집된 개인정보를 2차 사용하면 연구계획서에 기수집 정보를 쓰는 이유와 근거를 구체적으로 적어야 합니다(권고서식 제37호, 선정·제외 기준 포함). SOP 제21조의2는 이런 연구의 계획서를 기수집 개인정보를 이용해야 하는 이유, 당초 수집 근거·관리 책임과 제공 방법, 기획득 동의 범위 안의 이용이거나 법률상 2차 이용 근거를 알 수 있게 써서 낼 수 있게 합니다. 이전 연구에서 모은 자료라면 원 연구의 '2차적 사용' 동의 자료를 심의 신청 때 내야 합니다."
    add_text: "본 연구는 [제공 기관]이 [당초 수집 목적·근거]에 따라 수집·관리하는 [정보 항목]을 [제공 방법(예: 가명처리 후 제공)]으로 받아 이용한다. 기수집 정보를 이용해야 하는 이유는 [ ]이며, 2차 이용의 근거는 [기획득 동의 범위 / 법률상 근거]이다."
    source: "SOP ver5.5 제21조의2 · 권고서식 제37호 ver 2.0 「8. 선정 및 산출 근거」③ · FAQ 모음집(2025.12) 심의신청 19 「연구계획 – 연구자료 활용①」"
  - id: I-PUB-9
    when: kind=설문·면담
    level: 확인 필요
    warning: "온라인 설문조사는 설명문·동의서의 내용과 양식, 웹 구현 방식도 사전 검토 대상이라 관련 사항을 함께 내야 합니다. 동의 여부를 따로 확인하는 체크박스를 두면 서면동의에 준해 검토하고, 이때 동의서의 성명·서명·서명일 칸은 지우고 체크박스로 구성합니다. 위험이 없어 보이는 설문이라도 설명문의 '예상되는 위험(불편감)' 항목에 문항의 민감성과 응답에 드는 수고 등을 적어야 합니다."
    source: "FAQ 모음집(2025.12) 심의신청 22·26 「연구계획 – 온라인 설문조사」 · 23 「연구계획 – 예상 부작용 또는 위험성」"
  - id: I-PUB-10
