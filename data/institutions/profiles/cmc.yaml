id: cmc
name: 가톨릭대학교 서울성모병원 IRB (CMC)
short: 서울성모병원
aliases: [서울성모병원, 가톨릭대학교 서울성모병원, 가톨릭대학교서울성모병원, 학교법인가톨릭학원가톨릭대학교서울성모병원]
submit: CMC IRB 시스템(cmcirb.cmcnu.or.kr)의 CTSC(e-IRB) '과제접수 → 신규과제'에서 작성하고 책임연구자가 심사신청 (의뢰자·실무자는 책임연구자에게 심사신청 요청 메일)
source: CMC 임상연구윤리규정집 Ver.10.0(2026-06-01) 별표1·별지서식 CR-08·CR-10 (https://cmcirb.cmcnu.or.kr/irb_chrpp.do) · 심사 신청 안내의 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06)·CTSC 사용자매뉴얼 V2.0 [신규과제]·심사면제 절차 안내 및 관련 서식·개인정보 관련 IRB 심사 제출 서류 안내 (https://cmcirb.cmcnu.or.kr/irb_screeningapplication.do) · 자료실 CMC 서식(임상연구계획서 template 12종·설명문 및 동의서 template 2종, https://cmcirb.cmcnu.or.kr/irb_cmc.do) (확인 2026-09-30)
plan_form: 임상연구계획서 (연구 유형별 CMC template 중 해당 서식. 아래 칸은 개인정보 관련 IRB 심사 안내가 계획서·동의서에 적으라고 한 사항)
docs:
  신청서: 임상연구심사신청서 (CTSC 입력, 식별 가능한 개인정보 수집 여부 체크)
  계획서: 임상연구계획서 (연구 유형별 CMC template, 요약본 있으면 추가)
  자료양식: 증례기록서 양식(CRF) 또는 설문지 등
  동의서류: 연구대상자 설명문 및 동의서 (CMC template 중재연구·비중재연구) · 인체유래물연구동의서(법정서식) 또는 연구대상자 동의 면제 사유서·서면동의서 면제 사유서
  모집문서: 연구대상자 모집 광고문 (해당 시)
  서약서: 연구자 서약서 (FI-01)
  이력서: 책임연구자 이력서 (임상연구 시행 경력 포함, CTSC 업로드)
  교육: 연구진 필수 교육 이수 확인 정보 (CTSC)
  이해상충: 이해상충신고서_연구자용 (FI-02-01)
  데이터승인: 데이터심의위원회 사전심의 결과 통보 서식 (DRB를 거칠 때)
  면제점검: 심사면제 자가점검표 (CI-04)
  기관서류: 연구자의 윤리적 고려사항 (FI-03, 책임연구자가 CTSC 심사신청 탭에서 작성)
plan:        # 개인정보 관련 IRB 심의 안내가 계획서·동의서에 적으라고 한 것
  수집 정보 항목: 수집되는 개인정보의 유형
  수집 방법: 수집방법
  보관·폐기: 수집된 정보의 보관 기간
  수집 사유: 수집 사유
  개인정보 보호대책: 개인정보 보호 대책
  제3자 제공: 제3자 제공 여부 (가명화·익명화 여부)
variants:    # 자료실 'CMC 서식'의 계획서 template이 연구 유형마다 다르다. 내용을 읽은 두 서식(06·05)만 칸 이름을 옮겼다
  - when: kind=기록 이용
    plan_form: 연구계획서(수집된 의무기록 자료를 이용한 연구) — CMC 서식 template 06 (CDW 자료 이용 연구는 CMC nU CDW 데이터활용신청서로 대체)
    docs:
      계획서: 임상연구계획서 - 수집된자료이용연구 (CMC template 06, CDW 이용 연구는 CMC nU CDW 데이터활용신청서로 대체)
      자료양식: 증례기록서 양식 (계획서 서식의 첨부서류)
      데이터승인: 데이터심의위원회 심사승인 통보서 (기관 내 데이터심의위원회가 운영되는 기관만 필수)
    plan:
      배경·목적: 5. 연구의 배경 · 6. 연구의 목적
      선정·제외 기준: 7. 연구 대상자 및 선정기준, 제외기준
      수집 방법: 7. 자료를 어디에서 어떤 절차로 얻을지 · 10. 연구 방법 (자료수집 방법)
      대상 수·산출 근거: 8. 연구대상자수 및 산출근거
      연구 방법: 10. 연구 방법
      수집 정보 항목: 11. 관찰항목
      분석 방법: 12. 효과 평가기준, 평가방법, 해석방법(통계분석방법)
      개인정보 보호대책: 4. 인권침해 가능성 및 대책 (가명화/익명화 담당자·방식·기밀보호)
      보관·폐기: 4. 참고 (보관 및 폐기 계획)
      수집 사유: 수집 사유 (개인정보 관련 IRB 심사 안내, 계획서·동의서)
      제3자 제공: 제3자 제공 여부 (개인정보 관련 IRB 심사 안내, 가명화·익명화 여부)
  - when: kind=설문·면담
    plan_form: 연구계획서(설문조사연구) — CMC 서식 template 05
    docs:
      계획서: 임상연구계획서 - 설문조사연구 (CMC template 05)
      동의서류: 대상자동의서 - 비중재연구 (CMC template) 또는 연구대상자 동의 면제 사유서·서면동의서 면제 사유서
      모집문서: 대상자 모집 공고문 (해당 시, 계획서 서식의 첨부서류)
    plan:
      배경·목적: 5. 연구의 배경 · 6. 연구의 목적
      선정·제외 기준: 7. 연구 대상, 선정기준, 제외기준 및 조사 지역
      대상 수·산출 근거: 8. 연구대상자수 및 산출근거
      연구 방법: 10. 연구의 방법
      수집 정보 항목: 11. 관찰항목 및 측정도구
      분석 방법: 12. 효과 평가기준, 평가방법 및 해석방법 (통계분석방법)
      동의 절차: 4. 인권침해 가능성 및 대책 (동의를 받는 방식 — 누가·어디서·몇 분간)
      개인정보 보호대책: 4. 인권침해 가능성 및 대책 (가명화/익명화 담당자·방식·기밀보호)
rules:
  - id: I-CMC-1
    when: export
    level: 확인 필요
    warning: 데이터를 외부로 반출하는 연구는 IRB 심사 전에 기관 데이터심의위원회(DRB) 승인이 필요합니다(IRB 심사와 병행 가능, 서울성모·여의도성모·성빈센트, 2025.06 기준).
    source: CMC IRB 신규계획서 심사 신청 시 유의사항 · 개인정보 관련 IRB 심의 안내
  - id: I-CMC-2
    when: exempt
    level: 안내
    warning: 심사면제는 자가점검표(CI-04)로 신청합니다. 면제에 해당하지 않으면 신속심사로 전환되고, 추가 확인이 필요하면 계획서를 고쳐 다시 판정합니다.
    source: CMC 심사면제 절차 안내
  - id: I-CMC-3
    when: export
    told: [보안환경, 보안 환경]
    level: 보완 필요
    warning: 데이터를 외부로 반출하면 계획서에 가명화 절차·반출 방법·수령기관 보안환경을 적어야 합니다.
    add_text: "외부 반출 시 [가명화 절차]를 거친 데이터만 [반출 방법]으로 제공하며, 수령기관 [기관명]은 [보안환경: 접근 통제·암호화 등]에서 분석한다."
    source: CMC IRB 신규계획서 심사 신청 시 유의사항
  - id: I-CMC-4
    when: always
    check: english_title
    level: 보완 필요
    warning: "CTSC 기본정보에 과제명을 국문과 영문으로 입력하고, CMC 계획서 서식도 1번 칸에 국문·영문 과제명을 적게 합니다. CTSC 입력값과 계획서·동의서의 과제명(국문/영문)이 다른 것은 이 위원회가 꼽은 다빈도 보완요청 사항입니다."
    add_text: "연구 과제명 — 국문: [ ] / 영문: [ ]"
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [기본 정보] · CTSC 사용자매뉴얼 V2.0 [신규과제] 1-나 · CMC 서식 임상연구계획서 template 1. 연구 과제명
  - id: I-CMC-5
    when: always
    check: sample_size_rationale
    told: [산출근거, 산출 근거, 산정근거, 산정 근거]
    level: 보완 필요
    warning: "CMC 계획서 서식은 '연구대상자수 및 산출근거' 칸에, 탐색적 연구라도 연구 목적에 맞는 대상자 수 산정 근거를 적게 합니다. 설문조사연구 서식은 재현할 수 있도록 산정에 쓴 가정치를 모두 적게 합니다."
    add_text: "연구대상자수: [N]명. 산출근거: [선행연구 또는 검정력 분석 — 효과크기·유의수준·검정력·탈락률 등 가정치]에 따라 연구 목적 달성에 필요한 수로 정한다."
    source: CMC 서식 임상연구계획서 template(수집된자료이용연구·설문조사연구) 8. 연구대상자수 및 산출근거
  - id: I-CMC-6
    when: always
    check: period_before_review
    level: 보완 필요
    warning: "CMC 계획서 서식은 연구 기간을 'IRB 승인 후 ~ 20  .  .'로 적게 합니다. 의무기록 연구는 자료를 확보하는 기간만, 설문조사 연구는 설문을 실시하는 기간만 적고, 끝나면 종료보고서를 냅니다."
    add_text: "연구 기간: IRB 승인 후 ~ [YYYY.MM.DD]"
    source: CMC 서식 임상연구계획서 template(수집된자료이용연구·설문조사연구) 9. 연구 기간
  - id: I-CMC-7
    when: always
    level: 확인 필요
    warning: "CTSC 전산 입력 정보와 첨부한 계획서·동의서의 주요 정보가 반드시 같아야 합니다. 자주 어긋나는 항목은 과제명(국문/영문), 참여기관 수와 기관 정보, 연구예정기간, 연구대상자 수입니다. CTSC 연구정보 탭에 입력한 정보도 계획서 내용과 일치해야 합니다."
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [기본 정보] · CTSC 사용자매뉴얼 V2.0 [신규과제] 1-라
  - id: I-CMC-8
    when: always
    told: [세 이상, 세 이하, 세 미만, 세 초과]
    level: 보완 필요
    warning: "이 위원회는 연령으로 취약한 연구대상자(아동·미성년자, 만 75세 이상 노인) 포함 여부를 판단하므로, 계획서 선정·제외기준에 구체적인 연령 상한선 또는 하한선을 적어야 합니다."
    add_text: "선정기준: 만 [ ]세 이상 만 [ ]세 이하"
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [첨부파일 작성시 유의사항] 취약한 연구대상자 포함 연구
  - id: I-CMC-9
    when: kind=기록 이용|설문·면담
    told: [가명화 담당, 익명화 담당, 가명처리 담당, 가명화/익명화 담당]
    level: 보완 필요
    warning: "가명화·익명화를 하면 CMC 계획서 서식 4번 칸에 누가 맡고, 어떤 방식으로 운영하며, 기밀을 어떻게 보호하는지 자세히 적어야 합니다. 담당자는 제3자나 연구진으로 정할 수 있지만, 연구진이면 다른 연구 활동에 참여하지 않고 가명화·익명화만 위임받아야 합니다."
    add_text: "가명화/익명화는 [담당자: 제3자 또는 다른 연구 활동에 참여하지 않는 연구진]이 [방식]으로 수행하고, [대응표 분리 보관·접근 통제 등]으로 기밀을 보호한다."
    source: CMC 서식 임상연구계획서 template(수집된자료이용연구·설문조사연구) 4. 인권침해 가능성 및 대책, 윤리적 저촉 가능성 및 대책
  - id: I-CMC-10
    when: kind=기록 이용
    told: [폐기 계획, 파기 계획, 보관 및 폐기, 폐기한다, 파기한다]
    level: 보완 필요
    warning: "연구를 위해 확보한 의무기록은 승인된 연구 목적으로만 쓰고 논문 투고·검증에 필요한 기간 동안 보관한 뒤 폐기해야 하므로, 계획서에 보관 및 폐기 계획을 적어야 합니다. 다른 목적으로 다시 쓰려면 IRB 승인을 다시 받아야 합니다."
    add_text: "확보한 의무기록 자료는 승인된 연구 목적으로만 사용하고, 논문 투고·검증에 필요한 [기간] 동안 [보관 장소·방법]으로 보관한 뒤 [폐기 방법]으로 폐기한다. 다른 목적으로 다시 사용하려면 IRB 승인을 다시 받는다."
    source: CMC 서식 임상연구계획서 template(수집된자료이용연구) 4번 칸 참고
  - id: I-CMC-11
    when: kind=기록 이용
    level: 확인 필요
    warning: "CDW로 데이터를 추출할 계획이면 CTSC 기본정보의 연구종류 1에서 반드시 'CDW 자료이용연구'를 체크해야 하고, 계획서는 CMC nU CDW 데이터활용신청서로 대신합니다. 신규과제 작성 중 연구종류 1을 바꾸면 첨부파일 탭에 저장한 문서가 모두 지워집니다."
    source: CTSC 사용자매뉴얼 V2.0 [신규과제] 1-나 · CMC 서식 임상연구계획서 template(수집된자료이용연구) 주의 문구
  - id: I-CMC-12
    when: always
    level: 확인 필요
    warning: "연구자마다 필수 교육 이수와 최근 이력서가 CTSC에 올라가 있어야 하고, 연구진별 위임 업무와 면허 범위로 제한되는 업무의 위임이 맞는지도 확인합니다. 연구진 제출서류는 각자 본인 아이디로 CTSC에 접속해 작성합니다(책임연구자: 연구자서약서·이해상충신고서·연구자의 윤리적 고려사항, 공동연구자·CRC: 연구자서약서·이해상충신고서). 연구진 제출서류가 빠지면 '작성완료'를 할 수 없습니다."
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [연구진/의뢰자] · CTSC 사용자매뉴얼 V2.0 [신규과제] 1-다 · CMC IRB FAQ 「…연구진 제출서류의 종류는 무엇이며…」(2023-12-01)
  - id: I-CMC-13
    when: kind=중재|관찰|설문·면담|인체유래물
    level: 확인 필요
    warning: "설명문 및 동의서는 쉬운 국문으로 쓰고, 영문 표기가 불가피하면 국문과 함께 적습니다. 연구진 연락처를 반드시 적고, 서명란이 다른 페이지로 넘어가지 않게 동의 서명 서식을 한 페이지로 만들기를 권합니다. 임신 정보 제공 동의서·연구대상자 외 제3자 동의서·아동승낙서 같은 추가 동의서가 필요하면 함께 내야 합니다."
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [첨부파일 작성시 유의사항] 동의서
  - id: I-CMC-14
    when: kind=중재|관찰|설문·면담|인체유래물
    level: 확인 필요
    warning: "검체나 데이터를 수집하면 동의서에 수집하는 검체·데이터의 종류, 수량, 보관기간을 적고, 2차 활용이 있으면 그 내용과 동의 여부 표시란을 넣어야 합니다. 개인정보와 민감정보는 구분해 세부 항목을 나열하고, 개인정보 수집·민감정보 수집·수집정보 국외 이전은 각각 따로 동의 여부를 표시하게 해야 합니다."
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [첨부파일 작성시 유의사항] 동의서 · 「인간대상연구에서 개인정보 관련 IRB 심사 시 제출 서류 안내」 1)
  - id: I-CMC-15
    when: always
    level: 확인 필요
    warning: "CMC 계획서 서식에서 해당하지 않는 항목은 '해당사항 없음'으로 적고, 참고용 파란 글씨(이탤릭)는 작성할 때 지워야 합니다."
    source: CMC 서식 임상연구계획서 template(수집된자료이용연구·설문조사연구) 계획서 작성시 유의사항
  - id: I-CMC-16
    when: always
    level: 확인 필요
    warning: "CTSC 첨부파일 탭에는 압축파일(.zip 등)이나 확장자 없는 파일을 올릴 수 없고, 암호가 걸린 파일은 해제해서 올려야 합니다. 필수 첨부파일(이름 앞 * 표시)이 없거나 버전 정보를 입력하지 않으면 '작성완료'를 누를 수 없습니다."
    source: CTSC 사용자매뉴얼 V2.0 [신규과제] 1-바
  - id: I-CMC-17
    when: always
    level: 확인 필요
    warning: "연구비가 있으면 CTSC 연구비 항목별 산출근거를 연구 절차와 대상자 수에 근거해 적고, 대상자 사례비(Volunteer Fee)는 '방문횟수 × 대상자 수 × 1회 지급액 = 총액' 꼴로 입력합니다. 국책과제로 산학협력단과 계약하면 연구비 지원 여부를 '없음'으로 체크하고 연구비 내역서를 참고용으로 첨부합니다."
    source: CMC IRB 「'신규 과제' 심사 신청 시 유의사항」(CTSC팝업용, 2025-06) [연구비] · CTSC 사용자매뉴얼 V2.0 [신규과제] 1-마
  - id: I-CMC-18
    when: drb
    level: 확인 필요
    warning: "소속 기관 데이터심의위원회의 사전심의 절차가 있으면 사전심의 결과 통보 서식(예: CMC nU CDW 데이터활용심의결과서, 데이터심의위원회 심의결과 통보서)을 IRB 서류에 넣어야 합니다. 의무기록 연구 계획서 서식도 기관 내 데이터심의위원회가 운영되는 기관은 심사승인 통보서를 필수로 첨부하게 합니다."
    source: CMC IRB 「인간대상연구에서 개인정보 관련 IRB 심사 시 제출 서류 안내」 2) · CMC 서식 임상연구계획서 template(수집된자료이용연구) 첨부서류
  - id: I-CMC-19
    when: exempt
    level: 확인 필요
    warning: "심사면제 자가점검표(CI-04)는 정부기관 허가 대상 연구가 아닐 것, 위험이 '최소한의 위험'을 넘지 않을 것, 대상자 선정이 공정할 것, 식별 가능한 정보가 없거나 법으로 익명성이 보증될 것, 기관장과 연구비 지원기관의 직접 계약이 필요 없을 것에 모두 '예'여야 한다고 적고 있습니다. 위험이 미미하다는 판단은 연구자와 IRB가 일치해야 하고, 대상자를 직접 조작하거나 대면하는 유형(점검표 3.1의 1)·2))은 취약한 환경의 연구대상자를 대상으로 하면 면제에 해당하지 않습니다."
    source: CMC 심사면제 절차 안내 및 심사면제 자가 점검표(연구자용) 별지서식 CI-04 Ver.9.4 (시행 2025-06-01)
