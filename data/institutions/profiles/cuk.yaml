    when: always
    level: 확인 필요
    warning: "신규심의와 심의면제 서류는 매월 정해진 접수기간(셋째 주 월요일 오전 9시~수요일 오전 9시, 3일)에만 이메일로 받습니다. 마감 뒤에는 다음 달 접수로 넘어갑니다. 모든 필수 서류가 갖춰지고 사무국 행정검토의 수정 요청을 모두 반영해 '접수 완료' 메일을 받아야 접수가 끝납니다."
