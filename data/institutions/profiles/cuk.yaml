id: cuk
name: 가톨릭대학교 성심교정 생명윤리심의위원회 (CUK-IRB)
short: 가톨릭대
aliases: [가톨릭대, 가톨릭대학교, 가톨릭대학교 성심교정, 가톨릭대 성심교정, 가톨릭대학교 생명윤리심의위원회, 가톨릭대학교 성심교정 생명윤리심의위원회, CUK-IRB]
submit: "IRB사무국 이메일(cuk_ss_irb4827@catholic.ac.kr)로 연구자가 제출. 신청서에 친필서명 또는 날인, 메일 제목 '[N월 신규심의 접수] 본인 성명, 지도교수 성명'. 신규심의·심의면제는 매월 접수기간(셋째 주 월 09시~수 09시)에만 받음 (공개 안내에 전자심의 시스템 없음)"
source: 가톨릭대 IRB사무국 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 최종 수정)·「2026년도 월별 신규심의 접수기간」(2026-01-16, 04-16 수정)·「2026년 11월 신규심의 & 심의면제 접수기간 안내」(2026-09-29)·「2차 자료 사용 심의면제 신청서식 및 제출 서류 목록 변경 안내」·심의안내(심의일정·신청방법·제출서류·면제대상)·서식 ver.3.8(2026-07-28 승인) (https://irb.catholic.ac.kr/irb/notice/notice.do?mode=view&articleNo=258944, https://irb.catholic.ac.kr/irb/guide-deli/documents_submitted.do, 확인 2026-09-30)
plan_form: 연구계획서(인간대상연구용) [별지 제2-1호] ver.3.8
docs:
  신청서: 연구계획심의신청서 [별지 제1호] (친필서명 또는 날인)
  계획서: 연구계획서(인간대상연구용) [별지 제2-1호]
  자료양식: 설문지·인터뷰 질문지·검사지·실험도구(실험자극 예시) 등 연구 도구 (자유 양식)
  동의서류: 연구대상자 설명문 및 동의서 [별지 제3-1호] (대상자별로 따로) · 연구참여자 개인정보수집이용동의서 [별지 제3-2호]·민감정보 처리에 대한 동의서 [별지 제3-3호] (해당 시) 또는 서면동의면제사유서 [별지 제3-4호]
  모집문서: 연구대상자 모집 문건 (포스터·SNS·이메일로 모집할 때 필수)
  서약서: 생명윤리준수서약서 [별지 제4호] (모든 연구자)
  이력서: 이력서(연구자용) [별지 제10호] (자유 양식 가능, 본교 소속 표기, 전임 교원 제외 모든 연구자)
  교육: 생명윤리 관련 교육 이수증 (수료 2년 이내, 공용위원회 e-IRB 또는 국립보건연구원 과정, 모든 연구자)
  이해상충: 이해상충공개서약서(연구자용) [별지 제5-1호] (모든 연구자)
  면제점검: 심의면제자가점검표 [별지 제11-2호] (심의면제 신청 시)
  기관서류: 연구자 개인정보수집이용동의서 [별지 제8-1호] (모든 연구자) · 지도교수서약서 [별지 제7호] (석사·박사과정생 필수, 자필 서명 원칙)
plan:        # [별지 제2-1호] 연구계획서(인간대상연구용) ver.3.8 의 칸
  배경·목적: 1. 연구배경 · 2. 연구목적
  선정·제외 기준: 7. 연구대상자 - 1) 연구대상자 (선정기준·제외기준)
  대상 수·산출 근거: 7. 연구대상자 - 예상 연구대상자 수와 산출 근거 (반드시 제시)
  동의 절차: 7. 연구대상자 - 4) 연구대상자 동의
  연구 방법: 8. 연구방법 - 1) 연구방법 및 절차
  수집 정보 항목: 8. 연구방법 - 2) 조사 항목
  수집 사유: 8. 연구방법 - 2) 조사 항목 (인구통계학적 정보는 항목과 사유 기재)
  분석 방법: 8. 연구방법 - 4) 자료 분석과 처리 방법
  위험과 이익: 10. 연구대상자 이익 및 보상 · 11. 연구대상자 위험
  개인정보 보호대책: 13. 연구대상자 개인정보보호대책 및 연구자료 관리방법
  보관·폐기: 13. 연구대상자 개인정보보호대책 및 연구자료 관리방법 (보관과 폐기 방법)
