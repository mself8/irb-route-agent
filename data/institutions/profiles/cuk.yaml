  - id: I-CUK-17
    when: exempt
    level: 확인 필요
    warning: "이 위원회의 심의면제 서식은 2차 자료를 쓰는 인간대상연구용[별지 제2-4호]과 보관된 인체유래물연구용[별지 제2-3호]뿐이고, 제출서류 안내는 인간대상연구용 계획서[별지 제2-1호]를 정규심의로 적고 있습니다. 2차 자료 심의면제는 심의면제신청서[제11-1호]·자가점검표[제11-2호]·계획서[제2-4호]·교육 이수증·지도교수서약서 또는 이력서(해당 시)·연구자 개인정보수집이용동의서를 냅니다. 심의면제도 신규심의와 같은 월별 접수기간에 받아 신속심의로 검토하고, 접수마감일로부터 10~14일 안에 결과를 통보합니다. 자가점검표는 위험이 미미하다는 판단이 연구자와 위원회 사이에 일치해야 면제될 수 있다고 적고 있으니, 2차 자료가 아닌 연구를 면제로 신청하려면 사무국에 먼저 확인하세요."
    source: 가톨릭대 IRB 제출서류·신청방법·심의일정 안내 · 공지 「★2차 자료 사용★[인간대상연구] 심의면제 신청서식 및 제출 서류 목록 변경 안내」(2023-06-09) · 심의면제자가점검표 [별지 제11-2호] ver.3.8
