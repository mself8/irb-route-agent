    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 유의사항 1 · 연구계획서 [별지 제2-1호] 12번 칸 주의사항
  - id: I-CUK-15
    when: kind=설문·면담|관찰|중재|인체유래물
    told: [즉시 파기, 즉시 폐기]
    level: 보완 필요
    warning: "보상 제공만을 위해 받은 연락처(휴대전화 번호·이메일 등)는 보상 지급을 마쳐 목적을 달성하면 즉시 폐기해야 합니다. 대상자가 개인정보 수집·이용에 동의하지 않거나, 동의를 철회하거나, 참여를 중단하면 그 대상자의 개인정보는 즉시 파기해야 합니다. 연구계획서와 설명문 및 동의서에 이 내용을 적습니다."
    add_text: "답례품 지급을 위해 수집한 [휴대전화 번호·이메일]은 지급을 마치는 즉시 폐기한다. 연구대상자가 개인정보 수집·이용에 동의하지 않거나 동의를 철회하거나 참여를 중단하면 해당 대상자의 개인정보는 연구자료로 사용하지 않고 즉시 파기한다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 유의사항 5
