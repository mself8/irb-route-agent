    level: 확인 필요
    warning: "한국어가 아닌 언어로 쓰거나 번역한 설명문·동의서를 쓰면 그 문서도 심의 대상이라 함께 내야 합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 15
  - id: I-CUK-13
    when: kind=설문·면담|관찰|중재|인체유래물
    level: 확인 필요
    warning: "연구대상자 설명문 및 동의서의 연구 제목은 대상자 눈높이에 맞게 쉽고 직관적으로 풀어 써야 합니다. 연구계획서 제목과 글은 달라도 뜻은 같아야 하고, 설명문과 동의서에는 같은 제목을 씁니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 3 · 유의사항 4
  - id: I-CUK-14
    when: kind=설문·면담|관찰|중재
    told: [상담 비용, 상담비]
    level: 보완 필요
    warning: "연구대상자가 불편감을 느껴 상담기관으로 연계할 때 1회기에 한해 연구자가 상담 비용을 부담하는 보호 조치를 연구계획서와 설명문 및 동의서에 적어야 합니다. 계획서 서식은 불이익 없이 중단할 수 있다는 내용과 상담 비용 부담 주체·회기 수도 적게 합니다."
