      보관·폐기: 9. 연구대상자 개인정보보호대책 및 연구자료 관리방법 (보관과 폐기 방법)
rules:       # check: 계획서 글에서 엔진이 찾을 수 있는 규칙의 검사 이름 (past_tense·mixed_style·age_without_man·sample_size_rationale·period_before_review·recruit_doc)
  - id: I-CUK-1
    when: always
    check: past_tense
    level: 보완 필요
    warning: "연구계획서는 연구를 하기 전에 쓰는 서류입니다. '모집하였다·분석하였다·사용하였다'처럼 이미 끝낸 것 같은 과거형으로 쓰면 이미 진행된 연구로 보여 접수 자체가 어려울 수 있고, 이 위원회는 이미 진행된 연구의 심의를 접수하지 않습니다. '모집할 것이다·분석한다·사용한다'처럼 미래나 현재 시점으로 써야 합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 1 · 유의사항 3(서술 시점)
  - id: I-CUK-2
    when: always
    check: sample_size_rationale
    told: [산출 근거, 산출근거]
    level: 보완 필요
    warning: "연구계획서에 예상 연구대상자 수와 그 산출 근거를 반드시 적어야 합니다. 예상 연구대상자 수는 모으려는 표본 수가 아니라 통계적으로 분석 결과를 낼 수 있는 N이고, 응답률 저조로 빠질 수를 감안해 정해야 합니다. '약·여명'처럼 모호한 표현은 쓰지 않습니다."
    add_text: "예상 연구대상자 수: [N]명. 산출근거: [선행연구(참고문헌) 또는 검정력 분석(효과크기·유의수준·검정력)]에 따라 분석에 필요한 최소 [n]명에 응답률 저조로 인한 탈락 [x]%를 반영하여 [N]명으로 정한다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 2·18 · 연구계획서 [별지 제2-1호] 7번 칸
  - id: I-CUK-3
    when: always
    check: mixed_style
    level: 보완 필요
    warning: "연구계획서는 평서체(~한다), 연구대상자 설명문 및 동의서는 경어체(~합니다)로 써야 합니다. 한 문서 안에서 '~한다'와 '~합니다', '~있다'와 '~있습니다'를 섞지 말고 하나의 문체로 통일해야 합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 17 · 유의사항 2(경어체와 평서체)
  - id: I-CUK-4
    when: always
    check: age_without_man
    level: 보완 필요
    warning: "만 나이 통일법 시행에 따라 IRB 제출 서류의 나이는 연구대상자 선정기준 등에서 모두 만 나이로 적어야 합니다(예: '만 19세 이상')."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 유의사항 6
  - id: I-CUK-5
    when: always
    check: period_before_review
    level: 보완 필요
    warning: "연구(참여) 기간에 심의 결과 통지 전 기간을 넣으면 승인 전에 연구를 시작하는 것으로 판단될 수 있습니다. 예를 들어 2월 정규심의는 2월 넷째 주 이후 결과가 통지되므로 참여 기간을 2월부터로 쓰면 안 됩니다. 이 위원회 계획서 서식은 연구기간을 '승인일로부터 ~ 년 월 일'로 적게 합니다."
    add_text: "연구기간: 승인일로부터 [YYYY년 MM월 DD일]까지"
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 14 · 연구계획서 [별지 제2-1호] 6. 연구기간
  - id: I-CUK-6
    when: kind=설문·면담|관찰|중재|인체유래물
    check: recruit_doc
    told: [모집 문건, 모집문건, 모집 공고문, 모집공고문]
    level: 확인 필요
    warning: "포스터 부착, SNS 모집글 게시, 이메일 등으로 참여자를 모집하면 연구대상자 모집 문건을 반드시 함께 내야 합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 9 · 연구계획서 [별지 제2-1호] 7-3) 주의사항
  - id: I-CUK-7
    when: always
    level: 확인 필요
    warning: "연구계획심의신청서·연구계획서·설명문 및 동의서·지도교수서약서 사이에 연구 제목, 연구 예정 기간, 수집하는 개인정보, 연구 자료와 개인정보의 보관기간, 설문 문항 수가 서로 같아야 합니다. 신청서의 모든 정보는 연구계획서와 일치해야 하고, 연구 방법은 해당하는 것에만 체크합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 4·5·6·11·16
  - id: I-CUK-8
    when: always
    level: 확인 필요
    warning: "연구계획심의신청서의 수집·이용 정보 범위에서, 인구통계학적 정보를 수집하면 '기타' 항목에 체크해야 합니다(연락처·주민번호 같은 개인식별정보와 구분)."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 8
  - id: I-CUK-9
    when: always
    level: 확인 필요
    warning: "대학원생 연구의 지도교수는 공동연구자로 적지 않습니다. 석사·박사과정생은 지도교수서약서[별지 제7호]를 내야 하고 자필 서명이 원칙입니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 7 · 「2026년도 월별 신규심의 접수기간」(2026-01-16) · 「2026년 11월 신규심의 & 심의면제 접수기간 안내」(2026-09-29)
  - id: I-CUK-10
    when: always
    level: 확인 필요
    warning: "이력서, 이해상충공개서약서, 연구자 개인정보수집이용동의서, 생명윤리준수서약서, 교육 이수증은 연구책임자뿐 아니라 공동연구자·연구담당자 모두 내야 합니다(이력서는 전임 교원만 제외). 교육은 공용위원회 e-IRB 또는 국립보건연구원 과정 가운데 연구 유형에 맞는 1개를 이수하고, 수료일로부터 2년간 유효합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 10 · 「2026년 11월 신규심의 & 심의면제 접수기간 안내」(2026-09-29) Ⅰ·Ⅱ
  - id: I-CUK-11
    when: always
    level: 확인 필요
    warning: "연구책임자 서명을 빠뜨리지 않아야 합니다(서명란은 이름을 텍스트로 적고 서명 필수). 반대로 연구참여자 동의서에는 연구책임자 서명을 미리 넣지 않고, 오프라인 동의서의 동의취득자 서명·성명·서명일은 신규심의 승인 뒤 모두 손으로 적어야 합니다."
    source: 가톨릭대 IRB 공지 「★[필독]★ 신규심의 서류 작성 시 유의사항」(2025-03-14, 2026-09-22 수정) 오류 사례 12·13 · 「2026년 11월 신규심의 & 심의면제 접수기간 안내」(2026-09-29)
  - id: I-CUK-12
