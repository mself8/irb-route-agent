id: kdca
name: 질병관리청 IRB
short: 질병관리청
aliases: [질병관리청, 질병관리청 IRB, 국립보건연구원]
submit: e-IRB(eirb.nih.go.kr)에서 연구책임자가 연구 수행 전에 신청 (e-IRB는 로그인 필요)
source: 박소연·임지민·손순영·곽은교, 「질병관리청 기관생명윤리위원회 표준운영지침 개정 내용 소개」, PHWR 2026;19(5):268-283 (2026-02-05 온라인), CC BY 4.0 (https://doi.org/10.56786/PHWR.2026.19.5.3 · e-IRB https://eirb.nih.go.kr 은 로그인 화면만 공개, 확인 2026-09-30)
plan_form: 연구계획서 (필수 포함 항목)
docs:
  신청서: e-IRB 신청
  계획서: 연구계획서 (배경·목적·방법·선정기준·동의절차·위험과 이익·개인정보보호대책 포함)
  자료양식: 자료수집 양식 (CRF·설문지 등)
  동의서류: 설명문 및 동의서 (해당 시)
  교육: 연구윤리 교육 이수증 (신청일로부터 최근 2년 이내)
  모집문서: 연구 참여자 모집 관련 문서 (해당 시)
  기관서류: 연구 내용에 따라 인체유래물 제공 확인서·배아줄기세포주 등록증 및 물질양도각서 등
plan:
  배경·목적: 배경·목적
  선정·제외 기준: 선정기준
  연구 방법: 방법
  동의 절차: 동의절차
  위험과 이익: 위험과 이익
  개인정보 보호대책: 개인정보보호대책
rules:
  - id: I-KDCA-1
    when: always
    level: 확인 필요
    warning: "연구책임자뿐 아니라 참여연구자 모두 신청일로부터 최근 2년 이내의 연구윤리 교육 이수 문서를 내야 합니다(국가생명윤리정책원·질병관리청·소속 기관이 인정하는 교육의 수료증). 인정기간을 확인해 주기적으로 갱신해야 합니다."
    source: PHWR 2026;19(5):268 「결과 4. 심의 신청 시 유의사항 1) 교육 이수」
  - id: I-KDCA-2
    when: drb
    level: 안내
    warning: "질병관리청 IRB는 2025년 9월 데이터분과(10인)를 신설했고, 데이터 수집·처리·분석의 개인정보보호 적절성, 가명정보·익명정보 활용 연구, 2차 데이터 활용 연구, 타기관 데이터 연계 연구를 심의할 예정이라고 안내합니다."
    source: PHWR 2026;19(5):268 「결과 5. 데이터분과 신설」
  - id: I-KDCA-3
    when: always
    check: past_tense
    level: 보완 필요
    warning: "이 위원회는 '모든 연구는 연구 시작 이전에 신청'을 가장 중요한 원칙으로 두고, 심의 없이 이미 수행 중이거나 수행 완료된 연구의 사후 심의와 심의면제 확인을 하지 않습니다. 계획서가 연구를 이미 한 것처럼 과거형으로 적혀 있으면 수행 전 계획으로 고쳐 써야 합니다."
    source: PHWR 2026;19(5):268 「결과 3. 심의 절차」
  - id: I-KDCA-4
    when: always
    check: period_before_review
    level: 보완 필요
    warning: "연구책임자는 연구 수행 전에 심의를 신청해야 합니다. 행정검토·보완 기간을 포함해 60일 이내 상정이 원칙이고 결과는 심의일로부터 10일 이내에 통보되므로, 연구 시작일을 심의 결과 통보보다 앞서 적으면 안 됩니다."
    add_text: "연구기간: IRB 승인일로부터 [YYYY.MM.DD]까지"
    source: PHWR 2026;19(5):268 「결과 3. 심의 절차 1) 심의 신청·5) 결과 통보·6) 심의 기간」
  - id: I-KDCA-5
    when: kind=중재|관찰|설문·면담|인체유래물
    level: 확인 필요
    warning: "동의서는 연구 참여자가 이해하기 쉬운 용어로 쓰고, 연구 목적 및 방법, 참여 기간 및 절차, 예상되는 위험 및 이익, 개인정보보호 방안, 자발적 참여 및 철회 권리, 참여 보상, 연구자 및 IRB 연락처를 반드시 넣어야 합니다. 동의권자·법정대리인·연구자의 서명이 빠지면 안 됩니다."
    source: PHWR 2026;19(5):268 「결과 4. 심의 신청 시 유의사항 2) 동의서 충실성」
  - id: I-KDCA-6
    when: always
    level: 확인 필요
    warning: "사무국 행정검토에서 서류가 미흡해 수정 요청을 받으면 30일 이내에 수정본을 내야 합니다. 정규심의에는 심의 14일 전까지 접수가 끝난 과제만 올라갑니다."
    source: PHWR 2026;19(5):268 「결과 3. 심의 절차 2) 행정검토 및 접수」
  - id: I-KDCA-7
    when: exempt
    level: 확인 필요
    warning: "심의면제는 사무국이 제출 서류를 검토해 생명윤리법 시행규칙 제13조(인간대상연구) 또는 제33조(인체유래물연구)에 해당한다고 확인한 경우에만 적용됩니다. 주요 대상은 공개 정보 이용 연구, 개인식별정보를 수집·기록하지 않는 연구, 「통계법」에 따라 수집된 자료를 이용하는 연구 등이고, 이미 수행된 연구의 심의면제 확인은 할 수 없습니다."
    source: PHWR 2026;19(5):268 「결과 2. 심의의 대상 및 종류 3) 심의면제」·「3. 심의 절차」
drb_order: unknown   # IRB와 데이터분과의 선후는 공개 자료에 없음
schedule: {kind: none, note: "질병관리청 정규심의는 매월 셋째 주 금요일·심의 14일 전 접수 마감·결과 10일 이내 (규칙만 공개, 2026 날짜 목록은 비공개) · 심의면제·신속심의는 수시(2~3일)"}
