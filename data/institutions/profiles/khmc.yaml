id: khmc
name: 경희대학교병원 임상시험심사위원회(IRB)
short: 경희대병원
aliases: [경희대병원, 경희대학교병원, 경희대학교병원 IRB, 경희대병원 IRB, 경희대학교병원 임상시험심사위원회]
submit: R-BAY e-IRB(r-bay.co.kr, 경희대학교병원 IRB)에 로그인해 '신청보고작성 → 신규계획'으로 신청 (경희의료원 홈페이지 'e-IRB' 링크와 같은 곳)
source: 경희대병원 IRB 공지(초기심의·심의면제 제출서류 안내, 2026년도 정규심의 일정, SOP Ver.9.5·9.6·9.7 개정 안내, 심사비 안내, 심의 접수 서류 검토 안내) · 경희의료원 임상의학연구소 IRB 소개 (https://r-bay.co.kr/agency/main/czNmb3IxZ2F4NUZwQmplaVVGY29Odz09 · https://www.khmc.or.kr/kr/research-education/research-institution/cri_organization1.do, 확인 2026-09-30)
plan_form: 연구계획서 (요약 포함) — 서식 칸 이름은 공개 페이지에서 확인 못 함
docs:
  신청서: 연구심의신청서 (e-IRB '신청보고작성 → 신규계획'에서 직접 입력)
  계획서: 연구계획서 (요약 포함, 계획서 안에 요약이 있으면 따로 안 냄)
  자료양식: 증례기록서(CRF) (데이터를 쓰는 연구는 증례기록 면제 사유서로 갈음)
  동의서류: 대상자설명서 및 동의서(수정 가능한 워드·한글 파일) 또는 동의면제(동의서 면제) 요청서 (후향적 의무기록 연구는 동의 면제 요청서)
  이력서: 연구책임자 최근 이력 및 경력 (최근 6개월 이내 서명, e-IRB에 등록돼 있으면 추가 제출 없음)
  교육: 임상시험등 종사자교육/임상연구 관련 교육 이수증 (연구자 전원, e-IRB에 유효한 이수증이 등록돼 있으면 추가 제출 없음)
  이해상충: 이해상충서약서 (e-IRB 양식함)
  면제점검: 심의 면제 요청서 (e-IRB 양식함 서식, 심의면제 신청 시)
  기관서류: 심의비 입금 확인증 또는 심의비 지원 확인증 · 연차지속심의 면제 요청서 (후향적 의무기록 연구, 해당 시)
rules:
  - id: I-KHMC-1
    when: always
    level: 보완 필요
    told: [연구번호, 연구대상자 코드, 부여한 코드, 코드화]
    warning: "증례기록서(CRF)에는 병원등록번호·주민등록번호·이름을 쓸 수 없고, 연구자가 부여한 코드로 기록해야 합니다."
    add_text: "증례기록서에는 병원등록번호·주민등록번호·성명을 기록하지 않고, 연구자가 부여한 코드[예: Case1]로만 기록한다."
    source: 경희대병원 IRB 공지 「초기심의 의뢰 시 제출서류 안내」(첨부 hwp) · 「심의 면제 의뢰 시 제출서류 안내」
  - id: I-KHMC-2
    when: always
    level: 확인 필요
    warning: "연구에 참여하는 모든 연구자가 관련 교육을 이수해야 IRB 심의와 연구 수행이 가능합니다. 의약품 임상시험이 아닌 연구는 e-IRB 온라인 교육을 이수하며 유효기간은 2년입니다. 교육 유효기간이 지나면 e-IRB 사용이 제한됩니다."
    source: 경희대병원 IRB 공지 「초기심의 의뢰 시 제출서류 안내」(첨부 hwp) · 「임상시험등 종사자교육/임상연구 관련 교육 이수증 등록 안내」 · 「IRB SOP & Guideline 개정(2021-05-01, 교육 유효기간 1년→2년)」
  - id: I-KHMC-3
    when: always
    level: 확인 필요
    warning: "접수 서류 사전 행정검토의 반송은 1회로 제한됩니다. 반송 의견을 반영하지 않고 다시 내면 미반영 항목을 포함해 심의가 진행되어 승인이 늦어질 수 있습니다."
    source: 경희대병원 IRB 공지 「IRB 심의 접수 서류 검토 관련하여 안내드립니다」(2026-09-03)
  - id: I-KHMC-4
    when: always
    level: 확인 필요
    warning: "영문 연구 제목을 반드시 적어야 합니다. 첨부파일은 파일명 앞에 번호를 붙여 20MB 이내 압축파일 3개로 내기를 권하고, 서류가 많으면 제출 목록(워드)을 함께 붙입니다."
    source: 경희대병원 IRB 공지 「초기심의 의뢰 시 제출서류 안내」(첨부 hwp)
  - id: I-KHMC-5
    when: always
    level: 확인 필요
    warning: "심의 의뢰 때 심의비 입금 확인증이나 심의비 지원 확인증을 냅니다. 연구비 없는 단일기관 연구자 주도 연구(의사직)는 연구책임자 1인당 연 2회까지 지원되고, 연구비 없는 다기관 연구·의사직 외 연구자(간호사 등) 연구·교비 지원 연구 등은 심사비가 면제됩니다."
    source: 경희대병원 IRB 공지 「심사비 안내」 · 「초기심의 의뢰 시 제출서류 안내」(첨부 hwp)
  - id: I-KHMC-6
    when: always
    level: 안내
    warning: "후향적 의무기록 연구는 초기심의 때 '연차지속심의 면제 요청서'를 내면 연차지속심의가 면제될 수 있습니다. 허가용 예비자료로 쓰는 연구·개인정보보호법에 저촉되는 연구·정부기관 연구비를 받는 연구, 이해상충이나 이전 중대한 미준수가 있으면 제외됩니다. 면제돼도 계획서 변경·연구진 변경 등은 IRB에 보고해야 합니다."
    source: 경희대병원 IRB 공지 「IRB SOP & Guideline 개정(Ver.9.5, 시행 2024-04-01)」
  - id: I-KHMC-7
    when: exempt
    level: 확인 필요
    warning: "심의면제는 '심의 면제 요청서'(e-IRB 양식함 서식)를 붙여 신청하며, 신속심의와 같은 담당이 받습니다. 면제 대상 범위와 면제가 안 될 때의 처리는 공개 문서에 없으니 담당에게 확인하세요."
    source: 경희대병원 IRB 공지 「초기심의 의뢰 시 제출서류 안내」(첨부 hwp) · 「심의 면제 의뢰 시 제출서류 안내」 · R-BAY 경희대병원 IRB 업무별 담당자 안내
  - id: I-KHMC-8
    when: drb
    level: 확인 필요
    warning: "경희의료원에는 데이터심의위원회(DRB)가 있고, R-BAY에 e-DRB를 시범 구축 중입니다(2026-08-24 공지: 9월 중 오픈 예정). IRB와 DRB의 순서와 DRB 결과 제출 여부는 공개 안내가 없으니 DRB 담당에게 확인하세요."
    source: R-BAY 경희대학교병원 (DRB) 공지 「경희의료원 데이터심의위원회 e-DRB 시범서비스 안내」 · R-BAY 경희대병원 IRB 업무별 담당자 안내
  - id: I-KHMC-9
    when: received_data
    level: 안내
    warning: "의료영상(PACS) 연구 데이터를 비식별화해 받으면 2026-09-01 신청분부터 산정 기준에 따라 비용이 부과됩니다(경희의료원 의료영상정보관리규정)."
    source: 경희대병원 IRB 공지 「연구 데이터 비식별화 비용 산정 안내」(2026-08-28, 첨부 pdf)
drb_order: unknown   # IRB와 DRB의 순서는 공개 안내 없음
schedule: {kind: none, note: "2026 정규심의 날짜·마감은 공개(패널 A·B·C 월 3회, 회의 14일 전 마감)이나 결과 통보 기한이 비공개라 역산 안 함 · 신속심의는 정해진 심의일 없이 행정검토 뒤 14일 이내 처리 · 보완 답변서는 처음 심의한 패널의 정규심의 14일 전까지"}
