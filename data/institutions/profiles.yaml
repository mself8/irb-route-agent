# 기관 층: 관할 위원회마다 제출 창구·제출 서류·기관 규칙·계획서 필수 항목·일정.
# 원자료는 prep/institutions(09-29 수집, 본선 전 사전 조사 자료)다. 여기에는 사실(서류 이름·규칙 요지)과 출처만 옮기고 원문은 옮기지 않는다.
# 서류(docs)와 계획서 항목(plan)은 아래 표준 목록의 키에 맞춘다 → 기관별 비교표(서식 표준화, 기관마다 다른 이름을 한 줄에 모은다).
# 규칙 조건(when)과 계획서 항목의 확인 방법은 src/agent/nodes/judge.py(venue)가 판정한다. 계획서 확인은 요약 계획서의 낱말로만 본다.

checked_at: "2026-09-29"

docs:        # 표준 제출 서류 (4개 기관의 합집합)
  신청서: 심의 신청서
  계획서: 연구계획서
  자료양식: 자료수집 양식 (CRF·설문지)
  동의서류: 설명문·동의서 또는 동의 면제 사유서
  서약서: 연구자 서약서
  이력서: 연구진 이력서
  교육: 생명윤리 교육 이수증
  이해상충: 이해상충 공개서
  데이터승인: DRB 결과·데이터 제공 허가
  면제점검: 심의면제 자가점검표
  기관서류: 기관 고유 서류

plan:        # 표준 계획서 항목 (합집합). facts: 이 사실이 계획서에 적혀 있으면 있음, words: 이 낱말이 있으면 있음
  배경·목적: {words: [배경, 목적, 필요성]}
  선정·제외 기준: {words: [선정 기준, 선정기준, 제외 기준, 제외기준, 포함 기준]}
  대상 수·산출 근거: {words: [산출 근거, 산출근거, 표본 수 산출, 표본수]}
  연구 방법: {facts: [F01], words: [연구 방법]}
  수집 정보 항목: {facts: [F16, F07], words: [수집 항목, 관찰 항목, 변수]}
  동의 절차: {facts: [F11], words: [동의]}
  위험과 이익: {words: [위험, 이익]}
  개인정보 보호대책: {words: [보호대책, 보호 대책, 대응표, 접근 통제, 접근하지 않는다, 암호화]}
  보관·폐기: {words: [보관 기간, 보관기간, 폐기, 파기]}
  분석 방법: {words: [분석 방법, 통계, 회귀, 검정]}

profiles:
  - id: public
    name: 공용기관생명윤리위원회
    short: 공용위원회
    aliases: [공용위원회, 공용IRB, 공용기관생명윤리위원회]
    submit: e-IRB(public.irb.or.kr)에서 연구책임자가 신청 → 행정점검 → 심의비 납부
    source: 공용위원회 e-IRB 제출서류 안내(PT0103R02)·SOP ver5.5·권고서식 제37호 (https://public.irb.or.kr/, 확인 2026-09-29)
    plan_form: 연구계획서 권고서식 제37호 (개인정보를 이용하는 연구)
    docs:
      신청서: e-IRB 입력 (연구진 전원의 연구이력·교육이수 입력)
      계획서: 연구계획서 권고서식 제37호
      자료양식: 연구대상자에게서 얻는 정보 목록 (CRF·설문지)
      동의서류: 설명문·동의서 (해당 시)
      서약서: 생명윤리준수서약서 (e-IRB 직접 작성)
      교육: 생명윤리 교육이수증 (최근 2년 이내)
      데이터승인: 다른 연구자에게서 받은 개인정보면 제공에 관한 기관위원회 승인서 등
      면제점검: 면제요건 확인 서류 (심의면제 신청 시)
    plan:
      배경·목적: 1. 연구 배경 · 2. 연구 목적
      선정·제외 기준: 7. 수집하려는 개인 정보 ② 선정 및 제외 기준
      대상 수·산출 근거: 8. 선정 및 산출 근거
      연구 방법: 9. 연구 방법
      수집 정보 항목: 7. 수집하려는 개인 정보 ①
      동의 절차: 9. 연구 방법 ① 모집 절차
      위험과 이익: 13. 연구대상자의 위험과 이익
      개인정보 보호대책: 9. 연구 방법 ③④ 가명처리 주체·방법
      보관·폐기: 11. 정보의 보관 및 폐기
      분석 방법: 12. 자료 분석과 통계적 방법
    rules:
      - id: I-PUB-1
        when: received_data
        level: 확인 필요
        warning: 연구목적으로 수집되지 않은 개인정보를 제공받는 연구는 데이터심의위원회 심의가 필요하다고 안내합니다. 제공 기관의 승인서 등을 함께 준비하세요.
        source: 공용위원회 e-IRB 제출서류 안내 PT0103R02
      - id: I-PUB-2
        when: always
        level: 확인 필요
        warning: 연구진 전원의 연구이력·교육이수를 e-IRB에 입력해야 하고, 교육이수증은 최근 2년 이내 것만 됩니다. 행정점검에서 서류가 모자라면 30일 안에 내야 합니다.
        source: 공용위원회 e-IRB 제출서류 안내 PT0103R02 · SOP ver5.5 제31조③
    schedule: {kind: public}

  - id: uos
    name: 서울시립대학교 생명윤리위원회
    short: 서울시립대
    aliases: [서울시립대학교, 서울시립대, 서울시립대학교 생명윤리위원회]
    submit: R-BAY(r-bay.co.kr)에서 신청하고 학과 조교를 통해 공문 발송
    source: 서울시립대 생명윤리위원회 표준운영지침 Ver.2.3·FAQ v3·R-BAY 공지 (https://research.uos.ac.kr/institutionalbioethicscommittee, 확인 2026-09-29)
    plan_form: 연구계획서 별지서식 9-3
    docs:
      신청서: 연구심의 신청서 [별지서식 6] (R-BAY 입력으로 갈음)
      계획서: 연구계획서 [별지서식 9-3] (가급적 10쪽 이내)
      자료양식: 기록·측정자료 (CRF 등) · 설문지 (해당 시)
      동의서류: 설명문 및 동의서 또는 서면동의면제사유서
      서약서: 생명윤리준수 서약서 [별지서식 7] (연구진 전원)
      이력서: 연구자 이력서 [별지서식 12] (자유양식 불가, 연구진 전원)
      교육: 생명윤리교육 이수증 (국가생명윤리정책원·R-BAY 교육만, 연구진 전원)
      이해상충: 이해상충공개서 (연구진 전원)
      데이터승인: 데이터 보관 기관의 데이터 허가 공문 (받은 데이터를 쓸 때)
      면제점검: 심의면제 자가점검표 [별지서식 14-1] (심의면제 신청 시)
      기관서류: 학과 조교를 통한 공문 (없으면 접수 불가)
    plan:
      배경·목적: 나. 연구배경 및 연구목적
      선정·제외 기준: 마. 연구대상자 선정, 예상 수, 산출 근거
      대상 수·산출 근거: 마. 연구대상자 선정, 예상 수, 산출 근거
      연구 방법: 사. 연구 방법
      수집 정보 항목: 아. 수집되는 자료 및 정보 등 관찰 항목
      동의 절차: 바. 연구대상자 모집 및 동의 과정
      위험과 이익: 자. 연구대상자의 위험과 이익, 보상
      개인정보 보호대책: 차. 안전대책 및 개인정보보호대책
      분석 방법: 카. 평가 기준 및 방법, 자료 분석 등 통계적 측면
    rules:
      - id: I-UOS-1
        when: exempt
        level: 확인 필요
        warning: 이 기관 FAQ는 신규 과제를 심의면제 포함 원칙상 정규심의 안건으로 보고, 면제는 공공·오픈데이터 위주로 안내합니다(표준운영지침 제39조는 기존 자료 이용 연구도 면제 대상으로 둡니다). 면제로 신청하기 전에 사무국에 확인하고, 정규심의 일정으로 준비하세요.
        source: 서울시립대 생명윤리위원회 FAQ v3 · 표준운영지침 제39조
      - id: I-UOS-2
        when: received_data
        told: [허가 공문, 데이터 허가]
        level: 보완 필요
        warning: 받은 데이터를 쓰면 데이터를 보관한 기관의 데이터 허가 공문이 필요하고, 사용 데이터를 계획서에 자세히 적어야 합니다.
        add_text: 본 연구는 [데이터 보관 기관]으로부터 [데이터 이름·항목·수집 기간]을 제공받아 이용하며, 데이터 보관 기관의 데이터 허가 공문을 첨부한다.
        source: 서울시립대 생명윤리위원회 FAQ v3 (심의면제 관련)
      - id: I-UOS-3
        when: always
        level: 확인 필요
        warning: 교육이수증은 국가생명윤리정책원이나 R-BAY 교육만 인정합니다(교내 연구윤리 교육 이수증은 불가). 이력서·교육이수증·이해상충공개서·서약서는 연구진 전원이 냅니다.
        source: 서울시립대 생명윤리위원회 FAQ v3 · R-BAY 공지
      - id: I-UOS-4
        when: always
        level: 확인 필요
        warning: 학과 조교를 통한 공문 발송이 있어야 접수됩니다. 마감일에 공문이 접수되지 않으면 받지 않으므로 마감 2~3주 전 접수를 권합니다.
        source: 서울시립대 R-BAY 공지 · FAQ v3
    exempt_regular: true   # 심의면제도 정규심의 안건이라 7일 빠른 길(가이드라인 표준절차)을 이 기관에서는 쓰지 않는다
    schedule: {kind: csv, path: data/schedules/uos_irb_2026.csv, result_days: 14, cycle_days: 25,
               note: "신규는 심의면제 포함 정규심의 안건 (FAQ v3) · 결과 통보 심의일로부터 14일 이내 (SOP 제36조②) · 보완은 다음 차수 정규심의"}

  - id: cmc
    name: 가톨릭대학교 서울성모병원 IRB (CMC)
    short: 서울성모병원
    aliases: [서울성모병원, 가톨릭대학교 서울성모병원, 가톨릭대학교서울성모병원, 학교법인가톨릭학원가톨릭대학교서울성모병원]
    submit: CMC IRB 시스템(cmcirb.cmcnu.or.kr)의 CTSC에서 신청
    source: CMC 임상연구윤리규정집 Ver.10.0 별표1·신규과제 유의사항·심사면제 절차 안내·개인정보 관련 IRB 심의 안내 (https://cmcirb.cmcnu.or.kr/, 확인 2026-09-29)
    plan_form: 임상연구계획서 (개인정보 관련 기재 사항)
    docs:
      신청서: 임상연구심사신청서 (CTSC 입력, 식별 가능한 개인정보 수집 여부 체크)
      계획서: 임상연구계획서 (요약본 있으면 추가)
      자료양식: CRF 또는 설문지
      동의서류: 설명문·동의서 또는 동의 면제 사유서·서면동의 면제 사유서
      서약서: 연구자 서약서 (FI-01)
      이력서: 책임연구자 이력서
      교육: 필수 교육 이수 정보
      이해상충: 이해상충신고서 (FI-02-01)
      데이터승인: 데이터심의위원회 사전심의 결과 통보 서식 (DRB를 거칠 때)
      면제점검: 심사면제 자가점검표 (CI-04)
      기관서류: 연구자의 윤리적 고려사항 (FI-03)
    plan:
      연구 방법: 수집방법
      수집 정보 항목: 수집되는 개인정보의 유형
      대상 수·산출 근거: 수집 사유
      개인정보 보호대책: 개인정보 보호 대책
      보관·폐기: 수집된 정보의 보관 기간
    rules:
      - id: I-CMC-1
        when: drb
        level: 확인 필요
        warning: 이 기관은 IRB 심사 전에 기관 데이터심의위원회(DRB) 승인이 필요합니다(IRB 심사와 병행 가능, 2025.06 기준). DRB 사전심의 결과 통보 서식을 함께 냅니다.
        source: CMC IRB 신규계획서 심사 신청 시 유의사항 · 개인정보 관련 IRB 심의 안내
      - id: I-CMC-2
        when: exempt
        level: 안내
        warning: 심사면제는 자가점검표(CI-04)로 신청합니다. 면제에 해당하지 않으면 신속심사로 전환되고, 추가 확인이 필요하면 계획서를 고쳐 다시 판정합니다.
        source: CMC 심사면제 절차 안내
      - id: I-CMC-3
        when: export
        told: [보안환경, 보안 환경]
        level: 보완 필요
        warning: 데이터를 외부로 반출하면 계획서에 가명화 절차·반출 방법·수령기관 보안환경을 적어야 합니다.
        add_text: "외부 반출 시 [가명화 절차]를 거친 데이터만 [반출 방법]으로 제공하며, 수령기관 [기관명]은 [보안환경: 접근 통제·암호화 등]에서 분석한다."
        source: CMC IRB 신규계획서 심사 신청 시 유의사항
    schedule: {kind: none, note: "서울성모병원 정규심사 날짜는 공개돼 있으나 접수 마감 규칙은 비공개 → 계산 불가 · 결과 확인 심사일 이후 7일 이내(업무일)"}

