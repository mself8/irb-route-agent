# 규칙표. 판정 조건은 src/agent/nodes/judge.py, 요건 문구·근거·원문은 이 파일이 정본이다.
# id: prep 판정규칙표(09-29) ID. G 범위 · T 임상시험 · S 연구 유형 · J 관할 · E 심의면제 · C 동의 · D 보건의료데이터.
#     prep에 없는 규칙은 팀 문서 번호(R-xx)를 id로 쓴다.
# team_id: 팀 문서 규칙표(R-01~R-20)에서 같은 규칙의 번호.
# text: prep이 09-29 국가법령정보센터 원문과 대조한 문장. team_checked는 T1이 현장에서 다시 대조하면 true로 바꾼다.
# 원문을 확인하지 못한 규칙은 text를 "(현장 확인 후 기입)"으로 둔다.
# checkpoint: true면 "미충족"이 제출 전에 고칠 점이다(미충족이 있으면 보완 1회 일정을 기본값으로 둔다).

